# Workspace root for the Rust core, the CLI, and the runtime bindings.
#
# Policy summary (details in docs/rust-workspace.md):
# - One product version shared with package.json (decision-release-bindings-in-lockstep).
# - MSRV is derived from the selected binding dependencies and pinned here;
#   `scripts/check-rust-workspace.py` fails when a resolved dependency needs more.
# - Every member inherits `[workspace.lints]`; unsafe code is denied workspace-wide
#   and forbidden in the core and CLI crates.

[workspace]
resolver = "3"
members = [
  "crates/secret-scan-core",
  "crates/secret-scan-cli",
  "bindings/node",
  "bindings/wasm",
  "bindings/python",
]

[workspace.package]
version = "0.1.0-beta.9"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/redact-secret/redact-secret"
homepage = "https://github.com/redact-secret/redact-secret#readme"
authors = ["omiologic"]
publish = false

[workspace.dependencies]
# Internal crates.
redact-secret = { path = "crates/secret-scan-core", version = "=0.1.0-beta.9" }

# Binding dependencies. The MSRV above is the maximum `rust-version` among the
# packages selected by these requirements; see docs/rust-workspace.md#msrv.
napi = "3.12"
napi-derive = "3.6"
napi-build = "2.4"
wasm-bindgen = "0.2.128"
pyo3 = "0.29"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Dependency boundary policy consumed by scripts/check-rust-workspace.py.
# The core crate may only depend (transitively, in normal and build
# dependency graphs) on packages listed in `allowed-dependencies`. The
# `forbidden-dependencies` list guards the whole workspace: it names crates that
# would introduce runtime network, filesystem, environment, telemetry, secret
# storage, or UI behavior into a library boundary. Bindings and the CLI may
# add entries to `binding-allowed-dependencies` when a host integration
# requires them; the core never may.
[workspace.metadata.redact-secret]
core-package = "redact-secret"
product-name = "Redact Secret"
allowed-dependencies = []
# Crates a binding needs to speak to its host. The core is binding-neutral:
# none of these may appear in its dependency graph, its manifest, or its
# sources. They are not in `forbidden-dependencies` because the bindings
# themselves depend on them legitimately.
binding-dependencies = [
  "napi", "napi-derive", "napi-build", "napi-sys",
  "pyo3", "pyo3-build-config", "pyo3-ffi", "pyo3-macros",
  "wasm-bindgen", "wasm-bindgen-macro", "js-sys", "web-sys", "serde-wasm-bindgen",
]
forbidden-dependencies = [
  # network
  "reqwest", "hyper", "ureq", "curl", "tokio", "async-std", "mio", "socket2",
  # filesystem and process environment
  "walkdir", "notify", "dotenv", "dotenvy", "dirs", "directories", "home",
  # telemetry and logging sinks
  "tracing", "tracing-subscriber", "log", "env_logger", "opentelemetry", "sentry",
  # secret storage
  "keyring", "secret-service", "security-framework",
  # user interfaces
  "crossterm", "ratatui", "dialoguer", "indicatif", "console",
]

# The stabilized public surface of the core crate: every name
# `crates/secret-scan-core/src/lib.rs` exports, and nothing else. A name may
# only join or leave this list in a change that reviews the API contract.
# `crates/secret-scan-core/tests/public_api.rs` pins that each one is usable.
core-public-api = [
  "Action",
  "ByteRange",
  "Candidate",
  "Confidence",
  "DEFAULT_MAX_FINDINGS",
  "DEFAULT_MAX_INPUT_BYTES",
  "DefaultPolicy",
  "DetectedFinding",
  "Detector",
  "DetectorContext",
  "DetectorFailure",
  "DetectorRegistry",
  "Finding",
  "FormatterFailure",
  "IncrementalLimits",
  "IncrementalPolicy",
  "IncrementalPolicyContext",
  "IncrementalResult",
  "IncrementalSanitizer",
  "MAX_IDENTIFIER_LENGTH",
  "MAX_PLACEHOLDER_LENGTH",
  "Obfuscation",
  "PlaceholderContext",
  "PlaceholderFormatter",
  "Policy",
  "PolicyContext",
  "PolicyFailure",
  "Profile",
  "RANGE_UNIT",
  "RegisteredDetector",
  "RulesetError",
  "RulesetErrorClass",
  "ScanResult",
  "SecretScanError",
  "SecretScanErrorCode",
  "SessionState",
  "Specificity",
  "VERSION",
  "WholeInputLimits",
  "default_placeholder_formatter",
  "is_identifier",
  "load_ruleset",
  "redact",
  "redact_with_limits",
  "run_detector_pipeline",
  "scan",
  "scan_and_redact",
  "scan_and_redact_with_limits",
  "scan_with_limits",
  "shannon_entropy",
  "typed_placeholder_formatter",
]

# What `cargo package` may publish for the core: the library, its README, and
# the manifest metadata cargo generates. Nothing else — in particular no
# fixture, test, or script — may travel with the crate.
core-package-globs = [
  ".cargo_vcs_info.json",
  "Cargo.lock",
  "Cargo.toml",
  "Cargo.toml.orig",
  "README.md",
  "src/**/*.rs",
]
core-package-required = ["Cargo.toml", "README.md", "src/lib.rs"]

# The CPython packaging contract for `bindings/python`, enforced by
# `scripts/check-python-package.py`. `bindings/python/pyproject.toml` and
# `.github/workflows/python-wheels.yml` must agree with every value here, so
# the distribution name, the abi3 floor, and the wheel matrix can only change
# in a reviewed manifest change. See docs/python-packaging.md.
#
# `python-distribution` is the PyPI name and `python-import-name` is the
# Python import path; per PEP 503 normalization, `redact-secret` and
# `redact_secret` are the same PyPI project identity, so no registry-fallback
# name is needed here (see `decision-adopt-redact-secret-naming-contract`).
python-distribution = "redact-secret"
python-import-name = "redact_secret"
python-native-module = "redact_secret._native"
# One abi3 wheel per platform serves every CPython from this floor upward, so
# the Cargo feature and the `requires-python` floor are the same statement and
# must not drift apart.
python-abi3-feature = "abi3-py310"
python-requires = ">=3.10"
python-wheel-tag = "cp310-abi3"
# Every target a release candidate must build and smoke-test a wheel for. A
# target leaves this list only by dropping a supported platform.
python-wheel-targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]

# The cross-platform qualification matrix, enforced by
# `scripts/check-artifact-matrix.py`. Every list below is the single
# declaration of a supported surface: `.github/workflows/artifact-qualification.yml`
# must build exactly these, `bindings/node/package.json` `napi.targets` must
# equal `node-addon-targets`, and every manifest declaring `engines.node`
# must claim exactly the majors `node-support-majors` names. A platform
# leaves a list only by dropping support for it. See docs/qualification.md.
node-addon-targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# Every target with a published `@redact-secret/node-<platform>` npm
# package: `bindings/node/npm/<platform>/package.json` must exist for each,
# `packages/javascript/package.json`'s `optionalDependencies` and
# `runtime/node.ts`'s host-to-package mapping must name exactly these
# packages, and no others. `decision-publish-musl-node-addons` extended this
# list to the addon's full eight triples, publishing the two musl addons
# `node-addon-targets` already builds and qualifies; `cli-release-targets`
# still records a musl exclusion of its own, unaffected by this list. See
# docs/qualification.md.
node-publish-targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# Every target a CLI release must build and smoke-test a `redact-secret` binary
# for. The CLI ships no musl variant, so this is the six triples the addon
# shares with `python-wheel-targets` and not the addon's own eight: a static
# musl executable is a supported artifact only where it is also published.
cli-release-targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
# Every browser engine the WebAssembly artifact is initialized and scanned
# in by `scripts/qualify-browser-artifact.mjs`.
browser-engines = ["chromium", "firefox", "webkit"]
# Every Node.js major `engines.node` claims and CI therefore exercises.
node-support-majors = [20, 22, 24]

[profile.release]
codegen-units = 1
lto = "fat"
