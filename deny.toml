# cargo-deny policy for the whole workspace. Run `cargo deny check`.
# The per-crate dependency boundary for the core lives in Cargo.toml under
# [workspace.metadata.redact-secret] and is enforced by
# scripts/check-rust-workspace.py, which also requires `targets` below to
# cover every `python-wheel-targets` triple plus wasm32-unknown-unknown.

[graph]
all-features = false
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
