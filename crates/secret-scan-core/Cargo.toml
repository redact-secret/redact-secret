[package]
name = "redact-secret"
description = "Deterministic secret detection and redaction for runtime data and AI context: scans text locally before it reaches logs, storage, telemetry, tools, or model context. Side-effect free: no runtime network, filesystem, environment, telemetry, secret storage, or UI."
keywords = ["secret-detection", "redaction", "security"]
categories = ["text-processing"]
readme = "README.md"
documentation = "https://docs.rs/redact-secret"
# The published package is the library and nothing else. The integration
# tests deliberately stay out of it: they `include_str!` the canonical
# fixtures under `conformance/fixtures/`, which live above this package root
# and therefore cannot travel with it. `scripts/check-rust-workspace.py`
# pins the resulting file list so a stray file cannot enter the package
# unnoticed.
include = ["src/**/*.rs", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Publication runs only through the gated release process
# (decision-ship-first-release-artifact-set); this override is what makes
# `cargo publish -p redact-secret` possible at all.
publish = true

[lib]
name = "redact_secret"

[dependencies]
# Intentionally empty. Additions must pass scripts/check-rust-workspace.py,
# which enforces [workspace.metadata.redact-secret] in the root Cargo.toml.

[dev-dependencies]
# Test-only. Dev-dependencies are outside the core boundary because they never
# ship (docs/rust-workspace.md#dependency-boundary); this one lets the
# integration tests read the canonical `conformance/fixtures/*.json` contract
# directly instead of copying fixture values into Rust, which
# decision-govern-cross-language-conformance rejects.
serde_json = "1"

[lints]
workspace = true
