name: SAST

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  opengrep:
    name: OpenGrep (pinned baseline)
    runs-on: ubuntu-latest
    # Bounded time: a hung download, a stuck scan, or a wedged upload can
    # never occupy a runner indefinitely -- issue #156 requires the gate to
    # fail rather than hang.
    timeout-minutes: 20
    permissions:
      contents: read
      # Required only by the SARIF-to-code-scanning upload step below; the
      # enforcement gate itself (the scan step's exit code) needs no more
      # than contents: read.
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # continue-on-error defers failure to the explicit "Enforce" step below
      # so the artifact and SARIF-upload steps still run `if: always()` --
      # SARIF availability must never be this gate's only enforcement signal.
      # `steps.scan.outcome` reports the step's real result independent of
      # continue-on-error, so the deferred failure is exact, not approximate.
      - name: Run the pinned, provenance-verified OpenGrep scan
        id: scan
        continue-on-error: true
        run: |
          python3 -B scripts/run-sast.py \
            --out sast/reports/ci-latest.json \
            --sarif-out sast/reports/ci-latest.sarif

      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-sast-report
          path: sast/reports/ci-latest.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload SARIF report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opengrep-sast-sarif
          path: sast/reports/ci-latest.sarif
          if-no-files-found: ignore
          retention-days: 90

      # Best-effort visibility into GitHub code scanning. Not every context
      # this workflow runs in has code scanning available (e.g. a fork PR's
      # restricted token, or Advanced Security not enabled), so this step is
      # allowed to fail or no-op without affecting the job's outcome -- the
      # real gate is the "Enforce scan result" step below, driven by the
      # scan's own exit code against sast/baseline.json.
      - name: Upload SARIF to code scanning
        id: upload
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sast/reports/ci-latest.sarif
          wait-for-processing: true

      # GitHub does not apply third-party SARIF suppressions to alert state.
      # Synchronize the reviewed baseline only after the upload has finished
      # processing, and only from main: dismissals and re-openings are
      # repository-wide state and must never be driven by a pull request.
      # Like the upload, this is advisory visibility; the scan outcome below
      # remains the sole enforcement signal.
      - name: Synchronize reviewed SARIF suppressions
        if: github.ref == 'refs/heads/main' && steps.upload.outcome == 'success'
        continue-on-error: true
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.upload.outputs.sarif-id }}
          sarif-file: sast/reports/ci-latest.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Issue #156's final-candidate evidence for issue #145 is "the exact
      # run URL and rule digest" -- both are already implicit in any GitHub
      # Actions run, but writing them to the job summary means a reviewer
      # copies them from one place instead of reconstructing them from logs.
      # Never includes a finding's message or path: only counts and digests.
      - name: Record OpenGrep evidence for issue #145
        if: always()
        run: |
          if [ -f sast/reports/ci-latest.json ]; then
            {
              echo "### OpenGrep SAST evidence (issue #145)"
              echo ""
              echo "| field | value |"
              echo "| --- | --- |"
              echo "| run | [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) |"
              echo "| source revision | $(jq -r '.source_revision' sast/reports/ci-latest.json) |"
              echo "| rules digest | $(jq -r '.rules_digest' sast/reports/ci-latest.json) |"
              echo "| tool version | $(jq -r '.tool_version' sast/reports/ci-latest.json) |"
              echo "| findings | $(jq -r '.findings | length' sast/reports/ci-latest.json) |"
              echo "| scan errors | $(jq -r '.errors | length' sast/reports/ci-latest.json) |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce scan result
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "OpenGrep SAST gate failed: unresolved blocking finding(s), unacknowledged scan error(s), or a scan/tool-integrity failure -- see the 'Run the pinned, provenance-verified OpenGrep scan' step above." >&2
            exit 1
          fi
