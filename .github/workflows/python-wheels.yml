name: Python wheels

# Builds and qualifies the CPython artifacts declared by
# `[workspace.metadata.redact-secret]` in the root Cargo.toml: one abi3 wheel per
# supported target plus a source distribution.
#
# Every wheel is smoke-tested on the architecture it was built for, on the abi3
# floor interpreter and on a current one - a single `cp3NN-abi3` wheel is only
# worth shipping if one build really does serve both. The wheels are installed
# with `--no-index --no-deps --only-binary :all:`, so an install that succeeds
# proves the wheel needs no network, no Python dependency, and no Rust
# toolchain (`decision-define-runtime-bindings`).
#
# `scripts/check-python-package.py` keeps the matrix below and the manifest in
# agreement; a target cannot be dropped here without a manifest change. The
# final `Wheel matrix` job is a required `main` branch-protection check, so the
# workflow must run for every pull request rather than use path filters that
# can leave the required check permanently pending.

on:
  pull_request:
  push:
    branches:
      - "rc/*"
  workflow_dispatch:
  workflow_call:
    inputs:
      # Issue #632: a throwaway version for the release rehearsal; see
      # `artifact-qualification.yml`. Empty for every other caller.
      rehearsal-version:
        description: Throwaway product version to build (X.Y.Z-beta.<run id>); empty for none.
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  # `github.workflow` is the *calling* workflow's name when this one is
  # called, so an `Artifact qualification` run and a direct `Python wheels` run
  # on the same ref do not serialize behind each other.
  group: python-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Python wheel run plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      pr: ${{ steps.plan.outputs.pr }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether this pull request needs wheels
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          full=true
          pr=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            full=false
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/python-wheels.yml|Cargo.toml|Cargo.lock)
                  pr=true
                  break
                  ;;
                bindings/python/*|crates/secret-scan-core/*|conformance/*)
                  pr=true
                  break
                  ;;
                scripts/check-python-package.py|scripts/qualify-python-wheel.py|scripts/tests/test_check_python_package.py)
                  pr=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          {
            echo "full=$full"
            echo "pr=$pr"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: Packaging policy
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the packaging contract
        run: python3 -B scripts/check-python-package.py

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Apply the rehearsal version (no-op outside a rehearsal)
        uses: ./.github/actions/apply-rehearsal-version
        with:
          version: ${{ inputs.rehearsal-version }}

      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m bindings/python/Cargo.toml

      # Inspects the archive, then checks both documented branches: with
      # MATURIN_NO_INSTALL_RUST=1 and no cargo the build fails with a message
      # that names cargo instead of fetching a toolchain, and with the
      # runner's toolchain the archive builds and passes the smoke test on its
      # own -- which it can only do if it vendored the core crate its path
      # dependency points at.
      - name: Qualify the source distribution
        run: python3 -B scripts/qualify-python-wheel.py --build-sdist dist/*.tar.gz

      - name: Upload the source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: auto
            smoke: host
            python-floor: "3.10"
            python-latest: "3.14"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            manylinux: auto
            smoke: host
            python-floor: "3.10"
            python-latest: "3.14"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            manylinux: musllinux_1_2
            smoke: alpine
            python-floor: "3.10"
            python-latest: "3.14"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            manylinux: musllinux_1_2
            smoke: alpine
            python-floor: "3.10"
            python-latest: "3.14"
          - target: x86_64-apple-darwin
            # `macos-13` was the last standard Intel image and was retired on
            # 2025-12-04; a job asking for it queues forever instead of
            # failing. `macos-15-intel` is its standard-size replacement.
            runner: macos-15-intel
            manylinux: auto
            smoke: host
            python-floor: "3.10"
            python-latest: "3.14"
          - target: aarch64-apple-darwin
            runner: macos-latest
            manylinux: auto
            smoke: host
            python-floor: "3.10"
            python-latest: "3.14"
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            manylinux: auto
            smoke: host
            python-floor: "3.10"
            python-latest: "3.14"
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            manylinux: auto
            smoke: host
            # CPython for Windows on Arm starts at 3.11, so 3.11 is the lowest
            # interpreter this target can be smoke-tested on. The wheel's abi3
            # floor is still 3.10, and the x64 job exercises it.
            python-floor: "3.11"
            python-latest: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Apply the rehearsal version (no-op outside a rehearsal)
        uses: ./.github/actions/apply-rehearsal-version
        with:
          version: ${{ inputs.rehearsal-version }}

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m bindings/python/Cargo.toml
          sccache: "true"

      - name: Set up the abi3 floor interpreter
        if: matrix.smoke == 'host'
        id: floor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-floor }}

      - name: Set up a current interpreter
        if: matrix.smoke == 'host'
        id: latest
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-latest }}

      # One abi3 wheel has to serve both interpreters, and the conformance run
      # exercises it against the shared corpus rather than against the source
      # tree.
      - name: Qualify the wheel
        if: matrix.smoke == 'host'
        shell: bash
        run: |
          python3 -B scripts/qualify-python-wheel.py \
            --conformance \
            --python "${{ steps.floor.outputs.python-path }}" \
            --python "${{ steps.latest.outputs.python-path }}" \
            dist/*.whl

      # A musllinux wheel cannot be installed on the glibc runner, so it is
      # qualified inside a musl image of the same architecture. Here the
      # interpreter under test is also the one running the tooling, so the
      # floor image needs `tomli`: `tomllib` only arrived in CPython 3.11.
      - name: Qualify the wheel on musl
        if: matrix.smoke == 'alpine'
        run: |
          for version in "${{ matrix.python-floor }}" "${{ matrix.python-latest }}"; do
            docker run --rm -v "$PWD:/io" -w /io "python:${version}-alpine" sh -c '
              python3 -c "import tomllib" 2>/dev/null ||
                pip install --quiet --disable-pip-version-check tomli
              python3 -B scripts/qualify-python-wheel.py --conformance dist/*.whl
            '
          done

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  pr-macos-wheel:
    name: PR macOS wheel smoke
    runs-on: macos-latest
    needs:
      - plan
      - policy
    if: needs.plan.outputs.pr == 'true'
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build the macOS wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64-apple-darwin
          args: --release --out dist -m bindings/python/Cargo.toml
          sccache: "true"

      - name: Set up the abi3 floor interpreter
        id: floor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up a current interpreter
        id: latest
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Qualify the wheel
        shell: bash
        run: |
          python3 -B scripts/qualify-python-wheel.py \
            --conformance \
            --python "${{ steps.floor.outputs.python-path }}" \
            --python "${{ steps.latest.outputs.python-path }}" \
            dist/*.whl

  qualify-matrix:
    name: Wheel matrix
    runs-on: ubuntu-latest
    needs:
      - plan
      - policy
      - pr-macos-wheel
      - sdist
      - wheels
    if: always()
    permissions:
      contents: read

    steps:
      - name: Require planning and policy jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          for result in "$PLAN_RESULT" "$POLICY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Python wheel matrix cannot pass because a required setup job finished with '$result'." >&2
              exit 1
            fi
          done

      - name: Accept a pull request that did not touch wheel inputs
        if: needs.plan.outputs.full != 'true' && needs.plan.outputs.pr != 'true'
        run: echo "Python wheel matrix skipped; this pull request did not touch wheel inputs." >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful pull request wheel smoke
        if: needs.plan.outputs.pr == 'true'
        env:
          PR_MACOS_RESULT: ${{ needs.pr-macos-wheel.result }}
        run: |
          if [[ "$PR_MACOS_RESULT" != "success" ]]; then
            echo "Python wheel matrix cannot pass because PR macOS smoke finished with '$PR_MACOS_RESULT'." >&2
            exit 1
          fi

      - name: Require successful wheel jobs
        if: needs.plan.outputs.full == 'true'
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          SDIST_RESULT: ${{ needs.sdist.result }}
          WHEELS_RESULT: ${{ needs.wheels.result }}
        run: |
          for result in "$POLICY_RESULT" "$SDIST_RESULT" "$WHEELS_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Python wheel matrix cannot pass because an upstream job finished with '$result'." >&2
              exit 1
            fi
          done

      - name: Check out repository
        if: needs.plan.outputs.full == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Apply the rehearsal version (no-op outside a rehearsal)
        uses: ./.github/actions/apply-rehearsal-version
        with:
          version: ${{ inputs.rehearsal-version }}

      - name: Download every artifact
        if: needs.plan.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      - name: List the artifacts
        if: needs.plan.outputs.full == 'true'
        run: ls -l dist

      # Every declared target produced exactly one wheel, and each artifact's
      # contents and metadata still hold after the round trip through the
      # artifact store.
      - name: Require the whole matrix
        if: needs.plan.outputs.full == 'true'
        run: python3 -B scripts/qualify-python-wheel.py --inspect-only --require-matrix dist/*
