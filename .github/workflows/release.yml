name: Release

# One dispatch publishes the whole product in lockstep
# (decision-release-bindings-in-lockstep, decision-ship-first-release-artifact-set):
# the npm package, the `redact-secret` and `redact-secret-cli` crates, and the
# `redact-secret` PyPI distribution. `ci` and `artifact-qualification` call the
# qualification workflows as reusable workflows (issue #77, RB-7) so every
# publish job below -- `publish`, `publish-crates`, and `publish-pypi` --
# gates on the exact same commit this workflow is running for.
#
# Issue #527: this workflow used to also call `python-wheels.yml` directly as
# its own top-level job, on top of the call `artifact-qualification.yml`
# already makes internally to qualify the Python wheels and source
# distribution -- building all nine Python artifacts twice, from
# independent, non-byte-reproducible builds. `python-wheels.yml` is now
# invoked exactly once per release run, from inside `artifact-qualification`
# alone, the same way the Node addon, browser, and CLI artifacts are only
# ever built there; `publish-pypi` downloads the wheels and source
# distribution that single build produced rather than rebuilding them, and
# additionally verifies each file's SHA-256 against
# `artifact-qualification`'s own recorded inventory before publishing -- a
# runtime check that fails loudly on any digest mismatch independently of
# whether the build topology ever regresses to two builds.
#
# `packages/javascript` depends on eight native `@redact-secret/node-<platform>`
# packages and `@redact-secret/wasm` (issue #79); `publish-native-dependencies`
# and `publish-wasm-dependency` (issue #141) publish those from the exact
# `node-addon-<target>`/`wasm-web` artifacts `artifact-qualification` already
# qualified for this commit -- packed, content-checked against the manifest
# each carries, published, and verified on the registry -- and `publish`
# (the wrapper) declares both in `needs:`, so it cannot become eligible ahead
# of them. `scripts/check-release-gate.py` enforces that `needs:` edge the way
# it already enforces the qualification gates. `@redact-secret/wasm` also
# carries the `common` profile artifact (`wasm-web-common`, issue #382,
# `decision-define-detector-profile-and-pack-contract`) under its `./common`
# subpath; `publish-wasm-dependency` assembles both artifacts into the one
# package directory before packing, and asserts the root artifact reports the
# `full` profile and the `./common` artifact reports `common` before anything
# is published (`scripts/check-release-gate.py`, issue #417, pins that this
# verification step exists and precedes the publish step below).
#
# This is the one first-npm-cutover path, not two: `scripts/publish-dependency-package.mjs`
# is idempotent by registry state, not by a cutover-vs-routine switch. The
# first time this runs, every dependency package is unpublished, so all seven
# publish; every routine release after it, they are already published at their
# pinned version, so the script verifies the registry's content matches this
# revision's and skips republishing (`npm` versions are immutable) -- the same
# dispatch handles both, so there is no separate "just publish the wrapper"
# path to run by mistake.
#
# Registry publication is not transactional across three registries: npm
# (the wrapper and seven dependency packages), crates.io (two crates), and
# PyPI (one distribution). `record-manifest` runs `if: always()` and records
# the observed state of each artifact family, so `reconcile-release.yml` can
# repair an explicitly authorized partial publication from the original
# qualified artifacts without rebuilding already qualified outputs.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # These call the qualification workflows as reusable workflows rather than
  # duplicating their jobs, so every publish job below gates on the exact
  # same commit this workflow is running for (`github.sha` is shared with
  # the caller) instead of a separate, potentially-stale CI run on the same
  # ref.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      benchmark_branch: main
    permissions:
      contents: read

  # Qualifies the Node addon, browser, and CLI artifacts, and -- issue #527 --
  # is the only place `python-wheels.yml` is invoked from this workflow, so
  # every Python wheel and the source distribution are built exactly once
  # per release run.
  artifact-qualification:
    name: Artifact qualification
    uses: ./.github/workflows/artifact-qualification.yml
    permissions:
      contents: read

  # Publishes the eight native dependency packages from the addons
  # `artifact-qualification` already built and qualified for this commit --
  # never rebuilt here (issue #141's "consumes the already-qualified
  # artifacts" requirement). Runs on one runner per platform, not a matching
  # native runner: publishing a precompiled `.node` file needs no native
  # toolchain, only the artifact and `npm publish`.
  publish-native-dependencies:
    name: Publish npm dependency ${{ matrix.platform }}
    needs: [ci, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            platform: darwin-x64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc

    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Determine the npm dist-tag
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').version")
          if [[ "$version" == *-* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      # `artifact-qualification.yml` uploads exactly `redact-secret.<platform>.node`
      # plus napi's generated loader; only the compiled library belongs in
      # the platform package (`bindings/node/npm/<platform>/package.json`'s
      # own `files`), so only it is copied in.
      - name: Download the qualified addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-addon-${{ matrix.target }}
          path: bindings/node

      # `artifact-qualification`'s `inventory` job records this exact file's
      # SHA-256 under the `node-addon` family; downloaded here so the step
      # below can prove the file about to be packed is that same one.
      - name: Download the qualified artifact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-inventory
          path: qualification-inventory

      - name: Assemble the platform package
        run: cp "bindings/node/redact-secret.${{ matrix.platform }}.node" "bindings/node/npm/${{ matrix.platform }}/"

      # Issue #528: this generalizes issue #527's Python check -- the
      # compiled addon this job is about to pack must be byte-identical to
      # the one `artifact-qualification` qualified, checked independently of
      # whether the download/assemble steps above still do that correctly.
      - name: Verify the assembled addon matches the qualified inventory
        run: |
          python3 -B scripts/verify-python-digest.py \
            --inventory qualification-inventory/artifact-inventory.json \
            --family node-addon --target "${{ matrix.target }}" --suffix .node \
            "bindings/node/npm/${{ matrix.platform }}/redact-secret.${{ matrix.platform }}.node"

      - name: Pack, content-check, publish, and verify
        run: node scripts/publish-dependency-package.mjs --package-dir "bindings/node/npm/${{ matrix.platform }}" --tag "${{ steps.tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `needs.<job>.outputs` on a matrix job carries only the last leg's
      # value, not all eight (GitHub Actions does not merge matrix outputs), so
      # each leg's registry state is recorded as its own artifact instead and
      # `record-manifest` downloads and merges all of them.
      - name: Report registry state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          jq -n --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}' > registry-state.json

      - name: Upload registry state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-state-native-${{ matrix.platform }}
          path: registry-state.json
          if-no-files-found: error

      # Issue #528: `comparable` is false here because npm re-packs this
      # qualified file into a new versioned tarball before publishing --
      # the tarball is not byte-comparable to the pre-pack file the step
      # above verified. `published` records the registry's own tarball
      # shasum (from `npm-registry-metadata.mjs`, the same helper "Report
      # registry state" already calls) purely for traceability.
      - name: Record artifact digest evidence
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').version" 2>/dev/null || true)
          qualified=$(jq -r --arg t "${{ matrix.target }}" \
            '.artifacts[] | select(.family=="node-addon" and .target==$t) | .sha256' \
            qualification-inventory/artifact-inventory.json 2>/dev/null || true)
          file=$(jq -r --arg t "${{ matrix.target }}" \
            '.artifacts[] | select(.family=="node-addon" and .target==$t) | .file' \
            qualification-inventory/artifact-inventory.json 2>/dev/null || true)
          published=""
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            [[ -n "$observed" && "$observed" != "unpublished" ]] && published="$observed"
          fi
          jq -cn \
            --arg id "npm:${package_name:-unknown}" \
            --arg file "${file:-unknown}" --arg qualified "${qualified:-}" --arg published "${published:-}" \
            '{($id): [{
              file: $file,
              built: (if $qualified == "" then null else $qualified end),
              qualified: (if $qualified == "" then null else $qualified end),
              published: (if $published == "" then null else $published end),
              comparable: false,
              note: "npm repacks the qualified compiled addon into a new versioned tarball before publishing; the tarball is not byte-comparable to the pre-pack file. \"Verify the assembled addon matches the qualified inventory\" already verified the pre-pack file byte-identical to the qualified digest; \"published\" here is the registry tarball'"'"'s own shasum, recorded for traceability rather than byte comparison."
            }]}' > artifact-digest.json

      - name: Upload artifact digest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-digest-native-${{ matrix.platform }}
          path: artifact-digest.json
          if-no-files-found: error

  # Publishes `@redact-secret/wasm` from the `wasm-web` and `wasm-web-common`
  # artifacts `artifact-qualification` already qualified for this commit --
  # never rebuilt here, the same "already-qualified artifacts" requirement
  # `publish-native-dependencies` follows. Both artifacts come from the
  # `browser` job of that reusable workflow (the `common` build is an
  # additional step there, not a separate job), so no extra `needs:` edge is
  # required beyond the existing `artifact-qualification` dependency.
  publish-wasm-dependency:
    name: Publish npm dependency (wasm)
    needs: [ci, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}
      artifact_digest_json: ${{ steps.digest.outputs.artifact_digest_json }}

    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Determine the npm dist-tag
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./bindings/wasm/npm/package.json').version")
          if [[ "$version" == *-* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Download the qualified browser artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: bindings/wasm/npm

      # The `common` profile artifact (`decision-define-detector-profile-and-pack-contract`,
      # issue #382): lands in the same package directory as the full
      # artifact above, under its own file names, so one pack/publish covers
      # both the unchanged root export and the `./common` subpath.
      - name: Download the qualified common browser artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web-common
          path: bindings/wasm/npm

      # AC7: never publish a tiny artifact under the full/default package
      # identity, and never publish the common artifact under a mismatched
      # profile. This does not diff bytes against a golden `full` build --
      # it instantiates each downloaded module and asks its own `profile()`,
      # the same "ask the artifact, don't trust the label" approach
      # `scripts/qualify-browser-artifact.mjs` uses in-browser.
      # `scripts/check-release-gate.py` (issue #417) pins that this step
      # exists, asserts both profiles, and precedes the publish step below.
      - name: Verify the root artifact reports the full profile
        shell: bash
        run: |
          node --input-type=module <<'NODE_VERIFY'
          import { readFileSync } from "node:fs";
          import init, { profile } from "./bindings/wasm/npm/redact_secret_wasm.js";
          import initCommon, { profile as profileCommon } from "./bindings/wasm/npm/redact_secret_wasm_common.js";

          await init(readFileSync("./bindings/wasm/npm/redact_secret_wasm_bg.wasm"));
          const reported = profile();
          if (reported !== "full") {
            throw new Error(
              `bindings/wasm/npm/redact_secret_wasm.js reports profile "${reported}", not "full" -- refusing to publish a non-full build under the full package identity`,
            );
          }
          console.log('bindings/wasm/npm/redact_secret_wasm.js reports profile "full" as expected.');

          await initCommon(readFileSync("./bindings/wasm/npm/redact_secret_wasm_common_bg.wasm"));
          const reportedCommon = profileCommon();
          if (reportedCommon !== "common") {
            throw new Error(
              `bindings/wasm/npm/redact_secret_wasm_common.js reports profile "${reportedCommon}", not "common" -- refusing to publish the common artifact under a mismatched profile`,
            );
          }
          console.log('bindings/wasm/npm/redact_secret_wasm_common.js reports profile "common" as expected.');
          NODE_VERIFY

      # Issue #528's generalization of issue #527's Python check: both
      # WebAssembly builds (`browser`, `browser-common`) about to be packed
      # must be byte-identical to what `artifact-qualification` qualified.
      - name: Download the qualified artifact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-inventory
          path: qualification-inventory

      - name: Verify the assembled browser artifacts match the qualified inventory
        run: |
          python3 -B scripts/verify-python-digest.py \
            --inventory qualification-inventory/artifact-inventory.json \
            --family browser --family browser-common \
            bindings/wasm/npm/redact_secret_wasm.js \
            bindings/wasm/npm/redact_secret_wasm.d.ts \
            bindings/wasm/npm/redact_secret_wasm_bg.wasm \
            bindings/wasm/npm/redact_secret_wasm_bg.wasm.d.ts \
            bindings/wasm/npm/redact_secret_wasm_common.js \
            bindings/wasm/npm/redact_secret_wasm_common.d.ts \
            bindings/wasm/npm/redact_secret_wasm_common_bg.wasm \
            bindings/wasm/npm/redact_secret_wasm_common_bg.wasm.d.ts

      - name: Pack, content-check, publish, and verify
        run: node scripts/publish-dependency-package.mjs --package-dir bindings/wasm/npm --tag "${{ steps.tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report registry state
        id: state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/wasm/npm/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/wasm/npm/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          json=$(jq -cn --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

      # Issue #528: `comparable` is false for the same reason as the native
      # dependency packages -- npm re-packs both qualified WebAssembly builds
      # into one new versioned tarball before publishing.
      - name: Record artifact digest evidence
        id: digest
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/wasm/npm/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/wasm/npm/package.json').version" 2>/dev/null || true)
          published=""
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            [[ -n "$observed" && "$observed" != "unpublished" ]] && published="$observed"
          fi
          records=$(jq -c --arg published "${published:-}" '
            [.artifacts[] | select(.family=="browser" or .family=="browser-common") | {
              file: .file,
              built: .sha256,
              qualified: .sha256,
              published: (if $published == "" then null else $published end),
              comparable: false,
              note: "npm repacks the qualified WebAssembly build into a new versioned tarball before publishing; the tarball is not byte-comparable to the pre-pack files. \"Verify the assembled browser artifacts match the qualified inventory\" already verified each pre-pack file byte-identical to the qualified digest; \"published\" here is the registry tarball'"'"'s own shasum, recorded for traceability rather than byte comparison."
            }]' qualification-inventory/artifact-inventory.json 2>/dev/null || echo '[]')
          json=$(jq -cn --arg id "npm:${package_name:-unknown}" --argjson records "$records" '{($id): $records}')
          echo "artifact_digest_json=$json" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `ci` covers the four ci.yml Rust jobs and the wasm32 job (rust-policy,
    # rust-native, rust-msrv, rust-wasm) plus the Node test matrix.
    # `artifact-qualification` is the Node addon, browser artifact, and CLI
    # qualification workflow issue #74 (RB-4) added. `publish-native-dependencies`
    # and `publish-wasm-dependency` are issue #141's gate: this job must not
    # be reachable until every runtime dependency the wrapper declares has
    # published and verified.
    needs:
      - ci
      - artifact-qualification
      - publish-native-dependencies
      - publish-wasm-dependency
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}
      artifact_digest_json: ${{ steps.digest.outputs.artifact_digest_json }}

    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/javascript/package.json').name")
          package_version=$(node -p "require('./packages/javascript/package.json').version")
          package_private=$(node -p "require('./packages/javascript/package.json').private === true")

          if [[ "$package_private" == "true" ]]; then
            echo "The package is marked private." >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            if [[ "$package_version" != *-beta.* ]]; then
              echo "Only beta prereleases are configured." >&2
              exit 1
            fi
            npm_tag=beta
          else
            npm_tag=latest
          fi

          tag_name="v$package_version"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            echo "Tag $tag_name already exists." >&2
            exit 1
          fi

          registry_result=$(node scripts/npm-registry-metadata.mjs "$package_name" "$package_version" 2>/dev/null || true)
          if [[ -n "$registry_result" && "$registry_result" != "unpublished" ]]; then
            echo "$package_name@$package_version is already published." >&2
            exit 1
          fi
          if [[ "$registry_result" != "unpublished" ]]; then
            echo "Could not prove that $package_name@$package_version is unpublished." >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Qualify release
        run: npm run release:check

      # Issue #528: the wrapper has no separate qualification build to
      # compare against (unlike the Node addon, browser, crate, and Python
      # artifacts, it is packed straight from this checkout), so this records
      # the shasum of the exact tarball `Release package` then publishes, as
      # its "qualified" digest. Issue #732: it must run after the build --
      # before `js:build`, `packages/javascript/dist/` does not exist and the
      # recorded shasum belongs to a tarball with no `dist/` at all, which is
      # what failed beta.7's `Verify npm publication` against a correct
      # publish. Publishing the packed file, not the directory, means the
      # verified bytes and the published bytes cannot diverge.
      - name: Compute the wrapper package identity
        id: pack
        shell: bash
        run: |
          npm run js:build
          npm pack --json --pack-destination "$RUNNER_TEMP" ./packages/javascript > "$RUNNER_TEMP/wrapper-pack.json"
          tarball="$RUNNER_TEMP/$(jq -r '.[0].filename' "$RUNNER_TEMP/wrapper-pack.json")"
          [[ -f "$tarball" ]]
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "shasum=$(jq -r '.[0].shasum' "$RUNNER_TEMP/wrapper-pack.json")" >> "$GITHUB_OUTPUT"

      - name: Release package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release.outputs.npm_tag }}
          WRAPPER_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish --access public --tag "$NPM_TAG" "$WRAPPER_TARBALL"

      # `npm view` consults npm's aggregate package metadata, which can stay a
      # cached 404 for a while after a fresh publish -- that is what produced
      # a false-negative "publish failed" report on beta.5 even though the
      # publish had actually succeeded. `npm-registry-metadata.mjs` reads the
      # immutable per-version endpoint directly instead, with a bounded,
      # documented wait for propagation. Issue #614: that window still
      # expired on beta.6, so `--publish-accepted` treats the successful
      # `npm publish` above as authoritative when the endpoint is still 404
      # at the deadline; a visible checksum that does not match the packed
      # tarball still fails. `verify-registry-install` waits out the lag.
      - name: Verify npm publication
        shell: bash
        run: |
          node scripts/npm-registry-metadata.mjs \
            "${{ steps.release.outputs.package_name }}" \
            "${{ steps.release.outputs.package_version }}" \
            "${{ steps.pack.outputs.shasum }}" \
            --publish-accepted

      # `if: always()` so a partial or failed release still reports what it
      # observed; `record-manifest` is what actually writes the manifest now
      # that more than one registry is involved.
      - name: Report npm registry state
        id: state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/javascript/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./packages/javascript/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          json=$(jq -cn --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

      - name: Record artifact digest evidence
        id: digest
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/javascript/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./packages/javascript/package.json').version" 2>/dev/null || true)
          qualified="${{ steps.pack.outputs.shasum }}"
          published=""
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            [[ -n "$observed" && "$observed" != "unpublished" ]] && published="$observed"
          fi
          json=$(jq -cn \
            --arg id "npm:${package_name:-unknown}" --arg qualified "${qualified:-}" --arg published "${published:-}" \
            '{($id): [{
              file: "packages/javascript",
              built: (if $qualified == "" then null else $qualified end),
              qualified: (if $qualified == "" then null else $qualified end),
              published: (if $published == "" then null else $published end),
              comparable: true,
              note: null
            }]}')
          echo "artifact_digest_json=$json" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates.io
    needs: [ci, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}
      artifact_digest_json: ${{ steps.digest.outputs.artifact_digest_json }}

    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      # `artifact-qualification`'s `inventory` job packages both crates once
      # (issue #528) and records each one's SHA-256 under the `crate` family;
      # the verify steps below compare that recorded digest against
      # crates.io's own published checksum instead of trusting that this
      # job's `cargo publish` reproduced the same bytes.
      - name: Download the qualified artifact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-inventory
          path: qualification-inventory

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate crate identity
        id: identity
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "redact-secret") | .version')
          for crate in redact-secret redact-secret-cli; do
            if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version"); then
              status=000
            fi
            if [[ "$status" == "200" ]]; then
              echo "$crate@$version is already published." >&2
              exit 1
            fi
            if [[ "$status" != "404" ]]; then
              echo "Could not prove that $crate@$version is unpublished." >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Core first: redact-secret-cli's manifest depends on the registry
      # release of redact-secret, not the path in this checkout
      # (`cargo package -p redact-secret-cli` proves this locally by failing
      # until the core is actually on crates.io).
      - name: Publish redact-secret
        run: cargo publish -p redact-secret --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for redact-secret on crates.io
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/redact-secret/${{ steps.identity.outputs.version }}")
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "redact-secret could not be verified on crates.io." >&2
          exit 1

      # Issue #528: crates.io reports the exact SHA-256 of the `.crate` file
      # it received, so this compares that checksum against what
      # `artifact-qualification` qualified before the CLI (which depends on
      # this exact published version) is allowed to publish.
      - name: Verify redact-secret publication matches the qualified crate
        shell: bash
        run: |
          checksum=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" \
            "https://crates.io/api/v1/crates/redact-secret/${{ steps.identity.outputs.version }}" | jq -r '.version.checksum')
          python3 -B scripts/verify-crate-digest.py \
            --inventory qualification-inventory/artifact-inventory.json \
            --crate redact-secret \
            --published-checksum "$checksum"

      - name: Publish redact-secret-cli
        run: cargo publish -p redact-secret-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for redact-secret-cli on crates.io
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/redact-secret-cli/${{ steps.identity.outputs.version }}")
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "redact-secret-cli could not be verified on crates.io." >&2
          exit 1

      - name: Verify redact-secret-cli publication matches the qualified crate
        shell: bash
        run: |
          checksum=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" \
            "https://crates.io/api/v1/crates/redact-secret-cli/${{ steps.identity.outputs.version }}" | jq -r '.version.checksum')
          python3 -B scripts/verify-crate-digest.py \
            --inventory qualification-inventory/artifact-inventory.json \
            --crate redact-secret-cli \
            --published-checksum "$checksum"

      - name: Report crates.io registry state
        id: state
        if: always()
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          core_state=unknown
          cli_state=unknown
          if [[ -n "$version" ]]; then
            for crate in redact-secret redact-secret-cli; do
              if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
                "https://crates.io/api/v1/crates/$crate/$version"); then
                status=000
              fi
              state=unknown
              [[ "$status" == "200" ]] && state=published
              [[ "$status" == "404" ]] && state=unpublished
              if [[ "$crate" == "redact-secret" ]]; then core_state=$state; else cli_state=$state; fi
            done
          fi
          json=$(jq -cn \
            --arg core "crate:redact-secret" --arg core_state "$core_state" \
            --arg cli "crate:redact-secret-cli" --arg cli_state "$cli_state" \
            '{($core): $core_state, ($cli): $cli_state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

      # Issue #528: records, into the durable release manifest (via
      # `record-manifest`), the digest each crate carried at qualification
      # and the checksum crates.io reports now -- independently of whether
      # the verify steps above passed, so a failed run still leaves a record
      # of what it observed (`record-manifest` runs `if: always()`).
      - name: Record artifact digest evidence
        id: digest
        if: always()
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          json='{}'
          if [[ -n "$version" && -f qualification-inventory/artifact-inventory.json ]]; then
            for crate in redact-secret redact-secret-cli; do
              qualified=$(jq -r --arg t "$crate" \
                '.artifacts[] | select(.family=="crate" and .target==$t) | .sha256' \
                qualification-inventory/artifact-inventory.json)
              file=$(jq -r --arg t "$crate" \
                '.artifacts[] | select(.family=="crate" and .target==$t) | .file' \
                qualification-inventory/artifact-inventory.json)
              published=""
              if status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
                "https://crates.io/api/v1/crates/$crate/$version") && [[ "$status" == "200" ]]; then
                published=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" \
                  "https://crates.io/api/v1/crates/$crate/$version" | jq -r '.version.checksum // empty')
              fi
              entry=$(jq -cn \
                --arg file "${file:-unknown}" --arg qualified "${qualified:-}" --arg published "${published:-}" \
                '[{
                  file: $file,
                  built: (if $qualified == "" then null else $qualified end),
                  qualified: (if $qualified == "" then null else $qualified end),
                  published: (if $published == "" then null else $published end),
                  comparable: true,
                  note: null
                }]')
              json=$(jq -cn --arg id "crate:$crate" --argjson entry "$entry" --argjson acc "$json" '$acc + {($id): $entry}')
            done
          fi
          echo "artifact_digest_json=$json" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Publish PyPI
    needs: [ci, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}
      artifact_digest_json: ${{ steps.digest.outputs.artifact_digest_json }}

    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Releases must run from main." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Download qualified wheels and source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      # `artifact-qualification`'s `inventory` job records the SHA-256 of
      # every artifact it qualified, including these wheels and the source
      # distribution, from the one build `python-wheels.yml` produced for
      # this commit (issue #527).
      - name: Download the qualified artifact inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-inventory
          path: qualification-inventory

      # Issue #527's acceptance criterion: the published wheel's digest must
      # equal the qualified wheel's digest, and this must fail loudly if they
      # ever differ, independently of the build topology above -- so a future
      # refactor that reintroduces a second build is caught here even if the
      # topology change itself goes unnoticed.
      - name: Verify published wheels match the qualified inventory
        run: |
          python3 -B scripts/verify-python-digest.py \
            --inventory qualification-inventory/artifact-inventory.json \
            dist/*

      # Reuses `scripts/qualify-python-wheel.py`'s own `workspace_version`
      # and `pep440_version` instead of restating the Cargo-to-PEP-440
      # conversion (`0.1.0-beta.1` -> `0.1.0b1`) a second time.
      - name: Determine the PyPI distribution identity
        id: identity
        shell: bash
        run: |
          read -r name version < <(python3 -B -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('qualify_python_wheel', 'scripts/qualify-python-wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.policy()['python-distribution'], module.pep440_version(module.workspace_version()))
          ")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC, `permissions.id-token: write` above): PyPI
      # must have a trusted publisher configured for this repository, the
      # `Release` workflow, and the `release` environment before this step
      # can succeed. There is no `NPM_TOKEN`-style secret to provision.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Report PyPI registry state
        id: state
        if: always()
        shell: bash
        run: |
          name="${{ steps.identity.outputs.name }}"
          version="${{ steps.identity.outputs.version }}"
          state=unknown
          if [[ -n "$name" && -n "$version" ]]; then
            if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json"); then
              status=000
            fi
            [[ "$status" == "200" ]] && state=published
            [[ "$status" == "404" ]] && state=unpublished
          fi
          json=$(jq -cn --arg artifact "pypi:${name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

      # Issue #528: PyPI reports the SHA-256 of every file it received
      # (`urls[].digests.sha256`), the same field `scripts/verify-recovery-
      # artifact.py` already reads, so this comparison is `comparable: true`
      # -- unlike npm, PyPI does not repackage the distributions it publishes.
      - name: Record artifact digest evidence
        id: digest
        if: always()
        shell: bash
        run: |
          name="${{ steps.identity.outputs.name }}"
          version="${{ steps.identity.outputs.version }}"
          published_json='{}'
          if [[ -n "$name" && -n "$version" ]]; then
            if metadata=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" "https://pypi.org/pypi/$name/$version/json" 2>/dev/null); then
              published_json=$(jq -c '[.urls[] | {(.filename): .digests.sha256}] | add // {}' <<<"$metadata" 2>/dev/null || echo '{}')
            fi
          fi
          records=$(jq -c --argjson published "$published_json" '
            [.artifacts[] | select(.family=="python-wheel" or .family=="python-sdist") | {
              file: .file,
              built: .sha256,
              qualified: .sha256,
              published: ($published[.file] // null),
              comparable: true,
              note: null
            }]' qualification-inventory/artifact-inventory.json 2>/dev/null || echo '[]')
          json=$(jq -cn --arg id "pypi:${name:-unknown}" --argjson records "$records" '{($id): $records}')
          echo "artifact_digest_json=$json" >> "$GITHUB_OUTPUT"

  # Issue #141's "registry-backed clean install" criterion: installs the
  # real, published `@redact-secret/core` -- no local tarball, no
  # `overrides` -- on a native runner for each supported Node platform
  # class, and awaits `initialize()` and a correct `scan()`.
  # `scripts/qualify-package-consumer.mjs` (in `artifact-qualification.yml`)
  # already proves the same contract before these packages are published,
  # against packed local tarballs standing in for the registry; this proves
  # it once they are, against the registry itself.
  verify-registry-install:
    name: Verify registry install ${{ matrix.target }}
    needs: [publish, publish-native-dependencies, publish-wasm-dependency]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            libc: musl
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            libc: musl
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: matrix.libc != 'musl'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # `consumer-harness.mjs` imports `esbuild` unconditionally (the browser
      # lane needs it); the node lane below never calls it, but still needs
      # it importable.
      - name: Install dependencies
        if: matrix.libc != 'musl'
        run: npm ci --ignore-scripts

      - name: Verify the registry-backed clean install
        if: matrix.libc != 'musl'
        run: node scripts/verify-registry-install.mjs --lane node

      # A musl addon cannot be loaded by the glibc runner's Node.js, so the
      # musl lanes install and verify inside a musl image of the same
      # architecture, as `artifact-qualification.yml`'s addon lanes do.
      # `--user` keeps the checkout free of root-owned files.
      - name: Verify the registry-backed clean install on musl
        if: matrix.libc == 'musl'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/io" -w /io node:22-alpine \
            sh -c 'npm ci --ignore-scripts && node scripts/verify-registry-install.mjs --lane node'

  verify-registry-install-browser:
    name: Verify registry install (browser)
    needs: [publish, publish-native-dependencies, publish-wasm-dependency]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the registry-backed clean install
        run: node scripts/verify-registry-install.mjs --lane browser

  tag-release:
    name: Tag verified release
    needs:
      - publish
      - publish-crates
      - publish-pypi
      - verify-registry-install
      - verify-registry-install-browser
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Require main as the release source
        if: ${{ github.ref != 'refs/heads/main' }}
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release source and version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Create annotated Git tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
        run: |
          TAG_NAME="v$PACKAGE_VERSION"
          tag_object=$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            --field tag="$TAG_NAME" \
            --field message="Release $PACKAGE_VERSION" \
            --field object="$GITHUB_SHA" \
            --field type=commit \
            --jq .sha)
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$TAG_NAME" \
            --field sha="$tag_object"

  # Runs even when a publish job above failed, so a partial release still
  # leaves a durable record of what it attempted
  # (decision-release-bindings-in-lockstep and ARCHITECTURE.md's
  # "Versioning, qualification, and release" section).
  record-manifest:
    name: Record release manifest
    needs:
      - publish
      - publish-native-dependencies
      - publish-wasm-dependency
      - publish-crates
      - publish-pypi
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # `needs.publish-native-dependencies.outputs` cannot carry all eight
      # matrix legs' registry state (GitHub Actions keeps only the last one),
      # so each leg uploaded its own `registry-state-native-<platform>`
      # artifact instead; this downloads all eight into one directory. A leg
      # that failed before its own upload step leaves nothing here, which the
      # merge below tolerates the same way it tolerates an empty job output.
      - name: Download native dependency registry states
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: dependency-registry-states
          pattern: registry-state-native-*
          if-no-artifact-found: warn

      # Issue #528: the same "matrix job outputs don't merge" limitation
      # applies to per-artifact digest evidence, so each native leg uploaded
      # its own `artifact-digest-native-<platform>` artifact too.
      - name: Download native dependency artifact digests
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: dependency-artifact-digests
          pattern: artifact-digest-native-*
          if-no-artifact-found: warn

      # Issue #511: `artifact-qualification`'s `support-matrix-drift` job
      # already decided, at qualification time, whether this candidate may
      # proceed; this only carries that decision's record through to the
      # durable manifest. A run where `artifact-qualification` never reached
      # that job (e.g. it failed earlier) leaves nothing here, which the
      # `|| echo '{}'` below tolerates the same way the registry-state merge
      # tolerates an empty job output.
      - name: Download the support-matrix drift record
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: support-matrix-drift
          path: support-matrix-drift
          if-no-artifact-found: warn

      # Issue #614: every `needs.*.outputs.*` value reaches this script
      # through `env:` and is read as "$VAR". Inline `${{ }}` substitution
      # splices the value into shell source before bash parses it, so an
      # apostrophe in a job output (the wasm digest note) ended a quoted
      # string and failed the step. `check-release-gate.py` rejects the
      # inline form in `run:` blocks.
      - name: Build and record the manifest
        id: manifest
        shell: bash
        env:
          NPM_REGISTRY_STATE_JSON: ${{ needs.publish.outputs.registry_state_json }}
          WASM_REGISTRY_STATE_JSON: ${{ needs.publish-wasm-dependency.outputs.registry_state_json }}
          CRATES_REGISTRY_STATE_JSON: ${{ needs.publish-crates.outputs.registry_state_json }}
          PYPI_REGISTRY_STATE_JSON: ${{ needs.publish-pypi.outputs.registry_state_json }}
          WASM_ARTIFACT_DIGEST_JSON: ${{ needs.publish-wasm-dependency.outputs.artifact_digest_json }}
          WRAPPER_ARTIFACT_DIGEST_JSON: ${{ needs.publish.outputs.artifact_digest_json }}
          CRATES_ARTIFACT_DIGEST_JSON: ${{ needs.publish-crates.outputs.artifact_digest_json }}
          PYPI_ARTIFACT_DIGEST_JSON: ${{ needs.publish-pypi.outputs.artifact_digest_json }}
        run: |
          version=$(node -p "require('./packages/javascript/package.json').version" 2>/dev/null || true)
          conformance_identity=$(git rev-parse "$GITHUB_SHA:conformance" 2>/dev/null || true)
          # Captured before the digest check below, which can exit nonzero:
          # `record-manifest` runs `if: always()` specifically so this
          # output -- and the manifest upload that names it -- survive a run
          # that fails the new digest-mismatch check (issue #528 acceptance
          # criterion 4).
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

          # A job that was skipped or failed before its own "report state"
          # step ran leaves its output empty, not `{}` -- default it here so
          # a partial release still yields a manifest instead of a jq error.
          npm_json="$NPM_REGISTRY_STATE_JSON"
          [[ -z "$npm_json" ]] && npm_json='{}'
          native_json=$(jq -s 'add // {}' dependency-registry-states/*/registry-state.json 2>/dev/null) || native_json='{}'
          wasm_json="$WASM_REGISTRY_STATE_JSON"
          [[ -z "$wasm_json" ]] && wasm_json='{}'
          crates_json="$CRATES_REGISTRY_STATE_JSON"
          [[ -z "$crates_json" ]] && crates_json='{}'
          pypi_json="$PYPI_REGISTRY_STATE_JSON"
          [[ -z "$pypi_json" ]] && pypi_json='{}'

          # Declare the whole product even when no publisher produced output.
          expected_json=$(node --input-type=commonjs -e '
            const p = require("./packages/javascript/package.json");
            const npm = [p.name, ...Object.keys(p.dependencies || {}), ...Object.keys(p.optionalDependencies || {})];
            const artifacts = [...npm.map(name => "npm:" + name), "crate:redact-secret", "crate:redact-secret-cli", "pypi:redact-secret"];
            console.log(JSON.stringify(Object.fromEntries(artifacts.map(name => [name, "unknown"]))));
          ')
          merged=$(jq -cn \
            --argjson expected "$expected_json" \
            --argjson npm "$npm_json" \
            --argjson native "$native_json" \
            --argjson wasm "$wasm_json" \
            --argjson crates "$crates_json" \
            --argjson pypi "$pypi_json" \
            '$expected + $npm + $native + $wasm + $crates + $pypi')

          artifact_args=()
          registry_args=()
          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' <<<"$merged")
            artifact_args+=(--artifact "$key")
            registry_args+=(--registry-state "$key=$value")
          done < <(jq -r 'keys[]' <<<"$merged")

          # Issue #528: the same defaulting rule as the registry-state
          # variables above -- a job that never reached its digest-recording
          # step leaves its output empty, so that contributes nothing rather
          # than breaking the merge.
          native_digest_json=$(jq -s 'add // {}' dependency-artifact-digests/*/artifact-digest.json 2>/dev/null) || native_digest_json='{}'
          wasm_digest_json="$WASM_ARTIFACT_DIGEST_JSON"
          [[ -z "$wasm_digest_json" ]] && wasm_digest_json='{}'
          wrapper_digest_json="$WRAPPER_ARTIFACT_DIGEST_JSON"
          [[ -z "$wrapper_digest_json" ]] && wrapper_digest_json='{}'
          crates_digest_json="$CRATES_ARTIFACT_DIGEST_JSON"
          [[ -z "$crates_digest_json" ]] && crates_digest_json='{}'
          pypi_digest_json="$PYPI_ARTIFACT_DIGEST_JSON"
          [[ -z "$pypi_digest_json" ]] && pypi_digest_json='{}'
          artifact_digests=$(jq -cn \
            --argjson native "$native_digest_json" \
            --argjson wasm "$wasm_digest_json" \
            --argjson wrapper "$wrapper_digest_json" \
            --argjson crates "$crates_digest_json" \
            --argjson pypi "$pypi_digest_json" \
            '$native + $wasm + $wrapper + $crates + $pypi')

          support_matrix_drift=$(cat support-matrix-drift/support-matrix-drift.json 2>/dev/null || echo '{}')

          python3 -B scripts/release-manifest.py \
            --source-revision "$GITHUB_SHA" \
            --conformance-identity "${conformance_identity:-unknown}" \
            --version "${version:-unknown}" \
            "${artifact_args[@]}" \
            "${registry_args[@]}" \
            --artifact-digests "$artifact_digests" \
            --support-matrix-drift "$support_matrix_drift" \
            --out manifest.json

      # `if: always()` so a run that fails the digest-mismatch check in
      # `release-manifest.py` -- which still writes `manifest.json` before
      # reporting that failure -- still uploads the manifest it wrote,
      # instead of the previous step's nonzero exit skipping this one.
      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ steps.manifest.outputs.version }}
          path: manifest.json
          if-no-files-found: error
