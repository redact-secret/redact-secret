name: Release

# One dispatch publishes the whole product in lockstep
# (decision-release-bindings-in-lockstep, decision-ship-first-release-artifact-set):
# the npm package, the `redact-secret` and `redact-secret-cli` crates, and the
# `redact-secret` PyPI distribution. `ci`, `python-wheels`, and
# `artifact-qualification` call the qualification workflows as reusable
# workflows (issue #77, RB-7) so every publish job below -- `publish`,
# `publish-crates`, and `publish-pypi` -- gates on the exact same commit this
# workflow is running for, and `publish-pypi` downloads the wheels
# `python-wheels` already qualified rather than rebuilding them.
#
# `packages/javascript` depends on six native `@redact-secret/node-<platform>`
# packages and `@redact-secret/wasm` (issue #79); `publish-native-dependencies`
# and `publish-wasm-dependency` (issue #141) publish those from the exact
# `node-addon-<target>`/`wasm-web` artifacts `artifact-qualification` already
# qualified for this commit -- packed, content-checked against the manifest
# each carries, published, and verified on the registry -- and `publish`
# (the wrapper) declares both in `needs:`, so it cannot become eligible ahead
# of them. `scripts/check-release-gate.py` enforces that `needs:` edge the way
# it already enforces the qualification gates.
#
# This is the one first-npm-cutover path, not two: `scripts/publish-dependency-package.mjs`
# is idempotent by registry state, not by a cutover-vs-routine switch. The
# first time this runs, every dependency package is unpublished, so all seven
# publish; every routine release after it, they are already published at their
# pinned version, so the script verifies the registry's content matches this
# revision's and skips republishing (`npm` versions are immutable) -- the same
# dispatch handles both, so there is no separate "just publish the wrapper"
# path to run by mistake.
#
# Registry publication is not transactional across five registries (npm's
# wrapper and seven dependency packages, crates.io x2, PyPI), so
# `record-manifest` runs `if: always()` and records the observed state of
# each of them, the way the npm-only manifest did before. `reconcile-release.yml`
# only reconciles the npm wrapper tag today; reconciling a partial dependency,
# crates.io, or PyPI publication is not yet built and is not assumed by
# anything here.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # These call the qualification workflows as reusable workflows rather than
  # duplicating their jobs, so every publish job below gates on the exact
  # same commit this workflow is running for (`github.sha` is shared with
  # the caller) instead of a separate, potentially-stale CI run on the same
  # ref.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  python-wheels:
    name: Python wheels
    uses: ./.github/workflows/python-wheels.yml
    permissions:
      contents: read

  artifact-qualification:
    name: Artifact qualification
    uses: ./.github/workflows/artifact-qualification.yml
    permissions:
      contents: read

  # Publishes the six native dependency packages from the addons
  # `artifact-qualification` already built and qualified for this commit --
  # never rebuilt here (issue #141's "consumes the already-qualified
  # artifacts" requirement). Runs on one runner per platform, not a matching
  # native runner: publishing a precompiled `.node` file needs no native
  # toolchain, only the artifact and `npm publish`.
  publish-native-dependencies:
    name: Publish npm dependency ${{ matrix.platform }}
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            platform: darwin-x64
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc

    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: |
          echo "Releases must run from an rc/<version> branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Determine the npm dist-tag
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').version")
          if [[ "$version" == *-* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      # `artifact-qualification.yml` uploads exactly `redact-secret.<platform>.node`
      # plus napi's generated loader; only the compiled library belongs in
      # the platform package (`bindings/node/npm/<platform>/package.json`'s
      # own `files`), so only it is copied in.
      - name: Download the qualified addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-addon-${{ matrix.target }}
          path: bindings/node

      - name: Assemble the platform package
        run: cp "bindings/node/redact-secret.${{ matrix.platform }}.node" "bindings/node/npm/${{ matrix.platform }}/"

      - name: Pack, content-check, publish, and verify
        run: node scripts/publish-dependency-package.mjs --package-dir "bindings/node/npm/${{ matrix.platform }}" --tag "${{ steps.tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `needs.<job>.outputs` on a matrix job carries only the last leg's
      # value, not all six (GitHub Actions does not merge matrix outputs), so
      # each leg's registry state is recorded as its own artifact instead and
      # `record-manifest` downloads and merges all of them.
      - name: Report registry state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/node/npm/${{ matrix.platform }}/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          jq -n --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}' > registry-state.json

      - name: Upload registry state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-state-native-${{ matrix.platform }}
          path: registry-state.json
          if-no-files-found: error

  # Publishes `@redact-secret/wasm` from the `wasm-web` artifact
  # `artifact-qualification` already qualified for this commit -- never
  # rebuilt here, the same "already-qualified artifacts" requirement
  # `publish-native-dependencies` follows.
  publish-wasm-dependency:
    name: Publish npm dependency (wasm)
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: |
          echo "Releases must run from an rc/<version> branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Determine the npm dist-tag
        id: tag
        shell: bash
        run: |
          version=$(node -p "require('./bindings/wasm/npm/package.json').version")
          if [[ "$version" == *-* ]]; then echo "tag=beta" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Download the qualified browser artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: bindings/wasm/npm

      - name: Pack, content-check, publish, and verify
        run: node scripts/publish-dependency-package.mjs --package-dir bindings/wasm/npm --tag "${{ steps.tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report registry state
        id: state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./bindings/wasm/npm/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./bindings/wasm/npm/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          json=$(jq -cn --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # `ci` covers the four ci.yml Rust jobs and the wasm32 job (rust-policy,
    # rust-native, rust-msrv, rust-wasm) plus the Node test matrix.
    # `artifact-qualification` is the Node addon, browser artifact, and CLI
    # qualification workflow issue #74 (RB-4) added. `publish-native-dependencies`
    # and `publish-wasm-dependency` are issue #141's gate: this job must not
    # be reachable until every runtime dependency the wrapper declares has
    # published and verified.
    needs:
      - ci
      - python-wheels
      - artifact-qualification
      - publish-native-dependencies
      - publish-wasm-dependency
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: |
          echo "Releases must run from an rc/<version> branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release identity
        id: release
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/javascript/package.json').name")
          package_version=$(node -p "require('./packages/javascript/package.json').version")
          package_private=$(node -p "require('./packages/javascript/package.json').private === true")

          if [[ "$package_private" == "true" ]]; then
            echo "The package is marked private." >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            if [[ "$package_version" != *-beta.* ]]; then
              echo "Only beta prereleases are configured." >&2
              exit 1
            fi
            npm_tag=beta
          else
            npm_tag=latest
          fi

          tag_name="v$package_version"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            echo "Tag $tag_name already exists." >&2
            exit 1
          fi

          registry_result=$(node scripts/npm-registry-metadata.mjs "$package_name" "$package_version" 2>/dev/null || true)
          if [[ -n "$registry_result" && "$registry_result" != "unpublished" ]]; then
            echo "$package_name@$package_version is already published." >&2
            exit 1
          fi
          if [[ "$registry_result" != "unpublished" ]]; then
            echo "Could not prove that $package_name@$package_version is unpublished." >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Qualify release
        run: npm run release:check

      - name: Release package
        run: npm run release -- --tag "${{ steps.release.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            published=$(npm view "${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.package_version }}" version 2>/dev/null || true)
            if [[ "$published" == "${{ steps.release.outputs.package_version }}" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "The published version could not be verified from npm." >&2
          exit 1

      # `if: always()` so a partial or failed release still reports what it
      # observed; `record-manifest` is what actually writes the manifest now
      # that more than one registry is involved.
      - name: Report npm registry state
        id: state
        if: always()
        shell: bash
        run: |
          package_name=$(node -p "require('./packages/javascript/package.json').name" 2>/dev/null || true)
          version=$(node -p "require('./packages/javascript/package.json').version" 2>/dev/null || true)
          state=unknown
          if [[ -n "$package_name" && -n "$version" ]]; then
            observed=$(node scripts/npm-registry-metadata.mjs "$package_name" "$version" 2>/dev/null || true)
            if [[ "$observed" == "unpublished" ]]; then
              state=unpublished
            elif [[ -n "$observed" ]]; then
              state=published
            fi
          fi
          json=$(jq -cn --arg artifact "npm:${package_name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  publish-crates:
    name: Publish crates.io
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: |
          echo "Releases must run from an rc/<version> branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Validate crate identity
        id: identity
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "redact-secret") | .version')
          for crate in redact-secret redact-secret-cli; do
            if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$crate/$version"); then
              status=000
            fi
            if [[ "$status" == "200" ]]; then
              echo "$crate@$version is already published." >&2
              exit 1
            fi
            if [[ "$status" != "404" ]]; then
              echo "Could not prove that $crate@$version is unpublished." >&2
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Core first: redact-secret-cli's manifest depends on the registry
      # release of redact-secret, not the path in this checkout
      # (`cargo package -p redact-secret-cli` proves this locally by failing
      # until the core is actually on crates.io).
      - name: Publish redact-secret
        run: cargo publish -p redact-secret --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for redact-secret on crates.io
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/redact-secret/${{ steps.identity.outputs.version }}")
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "redact-secret could not be verified on crates.io." >&2
          exit 1

      - name: Publish redact-secret-cli
        run: cargo publish -p redact-secret-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Report crates.io registry state
        id: state
        if: always()
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          core_state=unknown
          cli_state=unknown
          if [[ -n "$version" ]]; then
            for crate in redact-secret redact-secret-cli; do
              if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' \
                "https://crates.io/api/v1/crates/$crate/$version"); then
                status=000
              fi
              state=unknown
              [[ "$status" == "200" ]] && state=published
              [[ "$status" == "404" ]] && state=unpublished
              if [[ "$crate" == "redact-secret" ]]; then core_state=$state; else cli_state=$state; fi
            done
          fi
          json=$(jq -cn \
            --arg core "crate:redact-secret" --arg core_state "$core_state" \
            --arg cli "crate:redact-secret-cli" --arg cli_state "$cli_state" \
            '{($core): $core_state, ($cli): $cli_state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Publish PyPI
    needs: [ci, python-wheels, artifact-qualification]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    outputs:
      registry_state_json: ${{ steps.state.outputs.registry_state_json }}

    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: |
          echo "Releases must run from an rc/<version> branch." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Download qualified wheels and source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      # Reuses `scripts/qualify-python-wheel.py`'s own `workspace_version`
      # and `pep440_version` instead of restating the Cargo-to-PEP-440
      # conversion (`0.1.0-beta.1` -> `0.1.0b1`) a second time.
      - name: Determine the PyPI distribution identity
        id: identity
        shell: bash
        run: |
          read -r name version < <(python3 -B -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('qualify_python_wheel', 'scripts/qualify-python-wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print(module.policy()['python-distribution'], module.pep440_version(module.workspace_version()))
          ")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Trusted publishing (OIDC, `permissions.id-token: write` above): PyPI
      # must have a trusted publisher configured for this repository, the
      # `Release` workflow, and the `release` environment before this step
      # can succeed. There is no `NPM_TOKEN`-style secret to provision.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Report PyPI registry state
        id: state
        if: always()
        shell: bash
        run: |
          name="${{ steps.identity.outputs.name }}"
          version="${{ steps.identity.outputs.version }}"
          state=unknown
          if [[ -n "$name" && -n "$version" ]]; then
            if ! status=$(curl -s -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json"); then
              status=000
            fi
            [[ "$status" == "200" ]] && state=published
            [[ "$status" == "404" ]] && state=unpublished
          fi
          json=$(jq -cn --arg artifact "pypi:${name:-unknown}" --arg state "$state" '{($artifact): $state}')
          echo "registry_state_json=$json" >> "$GITHUB_OUTPUT"

  # Issue #141's "registry-backed clean install" criterion: installs the
  # real, published `@redact-secret/core` -- no local tarball, no
  # `overrides` -- on a native runner for each supported Node platform
  # class, and awaits `initialize()` and a correct `scan()`.
  # `scripts/qualify-package-consumer.mjs` (in `artifact-qualification.yml`)
  # already proves the same contract before these packages are published,
  # against packed local tarballs standing in for the registry; this proves
  # it once they are, against the registry itself.
  verify-registry-install:
    name: Verify registry install ${{ matrix.target }}
    needs: [publish, publish-native-dependencies, publish-wasm-dependency]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # `consumer-harness.mjs` imports `esbuild` unconditionally (the browser
      # lane needs it); the node lane below never calls it, but still needs
      # it importable.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the registry-backed clean install
        run: node scripts/verify-registry-install.mjs --lane node

  verify-registry-install-browser:
    name: Verify registry install (browser)
    needs: [publish, publish-native-dependencies, publish-wasm-dependency]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the registry-backed clean install
        run: node scripts/verify-registry-install.mjs --lane browser

  tag-release:
    name: Tag verified release
    needs:
      - publish
      - publish-crates
      - publish-pypi
      - verify-registry-install
      - verify-registry-install-browser
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate candidate branch version
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF"

      - name: Create annotated Git tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
        run: |
          TAG_NAME="v$PACKAGE_VERSION"
          tag_object=$(gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/tags" \
            --field tag="$TAG_NAME" \
            --field message="Release $PACKAGE_VERSION" \
            --field object="$GITHUB_SHA" \
            --field type=commit \
            --jq .sha)
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$TAG_NAME" \
            --field sha="$tag_object"

  # Runs even when a publish job above failed, so a partial release still
  # leaves a durable record of what it attempted
  # (decision-release-bindings-in-lockstep and ARCHITECTURE.md's
  # "Versioning, qualification, and release" section).
  record-manifest:
    name: Record release manifest
    needs:
      - publish
      - publish-native-dependencies
      - publish-wasm-dependency
      - publish-crates
      - publish-pypi
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # `needs.publish-native-dependencies.outputs` cannot carry all six
      # matrix legs' registry state (GitHub Actions keeps only the last one),
      # so each leg uploaded its own `registry-state-native-<platform>`
      # artifact instead; this downloads all six into one directory. A leg
      # that failed before its own upload step leaves nothing here, which the
      # merge below tolerates the same way it tolerates an empty job output.
      - name: Download native dependency registry states
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: dependency-registry-states
          pattern: registry-state-native-*
          if-no-artifact-found: warn

      - name: Build and record the manifest
        id: manifest
        shell: bash
        run: |
          version=$(node -p "require('./packages/javascript/package.json').version" 2>/dev/null || true)
          conformance_identity=$(git rev-parse "$GITHUB_SHA:conformance" 2>/dev/null || true)

          # A job that was skipped or failed before its own "report state"
          # step ran leaves its output empty, not `{}` -- default it here so
          # a partial release still yields a manifest instead of a jq error.
          npm_json='${{ needs.publish.outputs.registry_state_json }}'
          [[ -z "$npm_json" ]] && npm_json='{}'
          native_json=$(jq -s 'add // {}' dependency-registry-states/*/registry-state.json 2>/dev/null) || native_json='{}'
          wasm_json='${{ needs.publish-wasm-dependency.outputs.registry_state_json }}'
          [[ -z "$wasm_json" ]] && wasm_json='{}'
          crates_json='${{ needs.publish-crates.outputs.registry_state_json }}'
          [[ -z "$crates_json" ]] && crates_json='{}'
          pypi_json='${{ needs.publish-pypi.outputs.registry_state_json }}'
          [[ -z "$pypi_json" ]] && pypi_json='{}'

          # Declare the whole product even when no publisher produced output.
          expected_json=$(node --input-type=commonjs -e '
            const p = require("./packages/javascript/package.json");
            const npm = [p.name, ...Object.keys(p.dependencies || {}), ...Object.keys(p.optionalDependencies || {})];
            const artifacts = [...npm.map(name => "npm:" + name), "crate:redact-secret", "crate:redact-secret-cli", "pypi:redact-secret"];
            console.log(JSON.stringify(Object.fromEntries(artifacts.map(name => [name, "unknown"]))));
          ')
          merged=$(jq -cn \
            --argjson expected "$expected_json" \
            --argjson npm "$npm_json" \
            --argjson native "$native_json" \
            --argjson wasm "$wasm_json" \
            --argjson crates "$crates_json" \
            --argjson pypi "$pypi_json" \
            '$expected + $npm + $native + $wasm + $crates + $pypi')

          artifact_args=()
          registry_args=()
          while IFS= read -r key; do
            value=$(jq -r --arg k "$key" '.[$k]' <<<"$merged")
            artifact_args+=(--artifact "$key")
            registry_args+=(--registry-state "$key=$value")
          done < <(jq -r 'keys[]' <<<"$merged")

          python3 -B scripts/release-manifest.py \
            --source-revision "$GITHUB_SHA" \
            --conformance-identity "${conformance_identity:-unknown}" \
            --version "${version:-unknown}" \
            "${artifact_args[@]}" \
            "${registry_args[@]}" \
            --out manifest.json

          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-${{ steps.manifest.outputs.version }}
          path: manifest.json
          if-no-files-found: error
