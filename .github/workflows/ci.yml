name: CI

on:
  pull_request:
  push:
    branches:
      - "rc/*"
  # `Artifact qualification` calls this workflow so one commit's Rust format,
  # lint, test, MSRV, conformance, and wasm32 evidence is part of the same
  # run as every artifact built from it.
  workflow_call:
    inputs:
      benchmark_branch:
        description: Branch that must contain the immutable benchmark pin.
        type: string
        required: false
        default: develop

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The workspace MSRV. scripts/check-rust-workspace.py requires this value to
  # match `rust-version` in Cargo.toml and to cover every resolved dependency.
  MSRV: "1.88"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every major `engines.node` claims, declared once as
        # `node-support-majors` in the root Cargo.toml and enforced by
        # `scripts/check-artifact-matrix.py`.
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Network, outside the offline `npm run ci`: fetches redact-secret-adapters
      # at the 40-hex commit in adapters/pin-source.json, builds and `npm pack`s
      # the pinned packages, verifies each content digest, and installs them into
      # every consumer (examples/mcp-redact). `npm run ci` then only verifies the
      # installed tree (scripts/adapter-pins.py verify-installed).
      - name: Build and install the pinned adapter artifacts
        run: npm run adapter-pins:install

      - name: Run deterministic checks
        run: npm run ci

  rust-policy:
    name: Rust format, lint, and dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy on the common-profile browser binding
        run: cargo clippy -p redact-secret-wasm --all-targets --no-default-features --locked -- -D warnings

      - name: Check API surface, boundaries, versions, MSRV, and package contents
        run: npm run rust:check

      - name: Check the public API documents without a warning
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Verify the published core package builds on its own
        run: cargo package -p redact-secret --locked

      - name: Check dependency sources, licenses, advisories, and bans
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --locked

  rust-native:
    name: Rust native host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Smoke-check the CLI on this host
        shell: bash
        run: |
          expected="redact-secret $(node -p "require('./packages/javascript/package.json').version")"
          actual=$(cargo run --quiet --locked -p redact-secret-cli -- --version)
          if [[ "$actual" != "$expected" ]]; then
            echo "expected '$expected', got '$actual'" >&2
            exit 1
          fi

      # Issue #772: the shadow evidence scorer's integer scores and bands for
      # the conformance corpora and the hostile battery, from a release
      # build on this host. `shadow-determinism` below requires every host's
      # output to be byte-for-byte identical.
      - name: Set up Node.js for the shadow determinism input set
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Record shadow evaluations on this host
        shell: bash
        env:
          HOST: ${{ matrix.os }}
        run: |
          mkdir -p target/shadow-determinism
          node scripts/shadow-determinism.mjs inputs > target/shadow-determinism/inputs.jsonl
          cargo build --release --locked -p redact-secret --example shadow_evaluation
          for profile in full common; do
            target/release/examples/shadow_evaluation --profile "$profile" \
              < target/shadow-determinism/inputs.jsonl \
              > "target/shadow-determinism/$HOST-$profile.jsonl"
          done

      - name: Upload the shadow evaluations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-determinism-${{ matrix.os }}
          path: target/shadow-determinism/${{ matrix.os }}-*.jsonl
          if-no-files-found: error
          retention-days: 30

  rust-msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up the MSRV toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.MSRV }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check workspace on the MSRV
        run: cargo check --workspace --all-targets --locked

  rust-wasm:
    name: Rust wasm32 target
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up stable Rust with the wasm32 targets
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check the core and browser binding for wasm32
        run: cargo check -p redact-secret -p redact-secret-wasm --target wasm32-unknown-unknown --locked

      - name: Install wasm-bindgen-cli
        # Must match the `wasm-bindgen` version in Cargo.toml exactly: the
        # test runner refuses to run a Wasm binary built against a different
        # `wasm-bindgen` version than its own.
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Test the browser binding for wasm32 (via Node, no browser needed)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_ONLY_NODE: "1"
        run: cargo test -p redact-secret-wasm --target wasm32-unknown-unknown --locked

      # The `common` detector-profile artifact is the same crate built
      # without its default-on `full` feature
      # (decision-define-detector-profile-and-pack-contract). Its native
      # `#[test]`s and its wasm32 `wasm_bindgen_test`s run separately.
      - name: Test the common-profile browser binding natively
        run: cargo test -p redact-secret-wasm --no-default-features --locked

      - name: Test the common-profile browser binding for wasm32 (via Node)
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_ONLY_NODE: "1"
        run: cargo test -p redact-secret-wasm --no-default-features --target wasm32-unknown-unknown --locked

      # Issue #772. The shadow scorer is crate-internal, so the shipped
      # wasm32-unknown-unknown binding cannot reach it. The same core source
      # compiled for wasm32-wasip1 can, and runs here on V8's WebAssembly
      # engine through Node's built-in WASI host (scripts/wasi-run.mjs): the
      # core's unit tests (the evidence golden vectors, the artifact drift
      # test and the hostile-input tests among them), the canonical corpus,
      # and the shadow evaluation `shadow-determinism` compares with the
      # native hosts.
      # Node 24, not 22: Node 22.23.2's WASI host crashes with SIGSEGV in the
      # test that follows one growing the module's memory past 64 MiB
      # (`the_evaluation_path_applies_the_default_whole_input_limits`); Node
      # 22.16 and 24 run the same module cleanly.
      - name: Set up Node.js for the WASI runner
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test the core for wasm32-wasip1 (via Node WASI)
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node --no-warnings ${{ github.workspace }}/scripts/wasi-run.mjs
        run: cargo test -p redact-secret --target wasm32-wasip1 --locked --lib --test canonical_corpus

      - name: Record shadow evaluations on wasm32 (via Node WASI)
        run: |
          mkdir -p target/shadow-determinism
          node scripts/shadow-determinism.mjs inputs > target/shadow-determinism/inputs.jsonl
          cargo build --release --locked -p redact-secret --example shadow_evaluation --target wasm32-wasip1
          for profile in full common; do
            node --no-warnings scripts/wasi-run.mjs \
              target/wasm32-wasip1/release/examples/shadow_evaluation.wasm --profile "$profile" \
              < target/shadow-determinism/inputs.jsonl \
              > "target/shadow-determinism/wasm32-wasip1-$profile.jsonl"
          done

      - name: Upload the wasm32 shadow evaluations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-determinism-wasm32-wasip1
          path: target/shadow-determinism/wasm32-wasip1-*.jsonl
          if-no-files-found: error
          retention-days: 30

  shadow-determinism:
    name: Shadow scorer cross-runtime determinism
    needs: [rust-native, rust-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download every host's shadow evaluations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shadow-determinism-*
          merge-multiple: true
          path: shadow-determinism

      # Every host must produce identical integer scores and bands for the
      # same inputs (decision-freeze-the-shadow-evidence-score-and-confidence-contract,
      # section 7). The report holds counts and SHA-256s only, never a record.
      - name: Require identical shadow evaluations on every host
        shell: bash
        run: |
          status=0
          echo "## Shadow scorer cross-runtime determinism" >> "$GITHUB_STEP_SUMMARY"
          for profile in full common; do
            report="shadow-determinism/report-$profile.json"
            node scripts/shadow-determinism.mjs compare \
              "ubuntu-latest=shadow-determinism/ubuntu-latest-$profile.jsonl" \
              "macos-latest=shadow-determinism/macos-latest-$profile.jsonl" \
              "windows-latest=shadow-determinism/windows-latest-$profile.jsonl" \
              "wasm32-wasip1=shadow-determinism/wasm32-wasip1-$profile.jsonl" \
              > "$report" || status=1
            cat "$report"
            node -e 'const r = require(process.argv[1]); const [first] = Object.values(r.outputs);
              console.log(`- \`${process.argv[2]}\`: ${r.identical ? "identical" : "MISMATCH"} on ${Object.keys(r.outputs).join(", ")}; ${first.comparisons} comparisons, ${first.statistical} statistical; sha256 \`${first.sha256}\``)' \
              "$PWD/$report" "$profile" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      - name: Upload the determinism reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-determinism-report
          path: shadow-determinism/report-*.json
          if-no-files-found: ignore
          retention-days: 30

  benchmark-pin-drift:
    name: Benchmark pin drift (commit ancestry, vendored manifest and schema)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # scripts/check-benchmark-pins.py --check-ancestry resolves
      # pins.sourceRevision locally against this repository's own history, so
      # it needs the full history, not the default single-commit checkout the
      # other jobs use.
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Every benchmarkCommit, pins.sourceRevision, and the manifest revision must trace to a real ancestor; vendored files must match immutable refs
        env:
          BENCHMARK_BRANCH: ${{ inputs.benchmark_branch || 'develop' }}
        run: npm run benchmark-pins:check:ancestry -- --benchmark-branch "$BENCHMARK_BRANCH"

  adapter-pin-drift:
    name: Adapter pin drift (commit ancestry)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # A GitHub fetch by SHA succeeds for a commit on any branch, including an
      # unmerged one, so the build in the test job alone does not prove the pin
      # is merged. This does, through the compare API.
      - name: The pinned redact-secret-adapters commit must be on develop
        run: npm run adapter-pins:check:ancestry -- --adapters-branch develop

  reference-architectures:
    name: Reference architectures (registry and pinned installs)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The three commands docs/guides/reference-architectures.md documents,
    # exactly as a reader runs them. Each installs from the npm registry (and
    # the AI-context one also builds the pinned adapter tarballs), so they need
    # the network and stay outside the offline `npm run ci`.
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Application logging (pino, released @redact-secret/adapter-pino)
        run: npm run reference:logging

      - name: OpenTelemetry tracing (released @redact-secret/adapter-otel)
        run: npm run reference:tracing

      - name: AI context construction (pinned @redact-secret/adapter-ai-context)
        run: npm run reference:ai-context

  cross-repository-links:
    name: Cross-repository links (blob permalinks resolve)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # Pinned permalinks resolve against this repository's own history, so
      # this needs the full history, not the default single-commit checkout.
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Every github.com/redact-secret/<repo>/blob/<ref>/<path> link must resolve (network; not part of the offline `npm run ci`)
        run: npm run cross-repo-links:check

  changelog-coverage:
    name: Changelog coverage (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # scripts/check-changelog-coverage.py compares this pull request's
      # CHANGELOG.md against its merge base, so it needs both sides, not the
      # default single-commit checkout the other jobs use.
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Every GitHub Actions expression is read through the environment, never
      # interpolated into the shell snippet: the SAST rules re-parse a `run:`
      # block as Bash, and `${{ ... }}` is not valid Bash (see the
      # `curl-eval` partial-parsing entries in sast/baseline.json).
      - name: A detector or binding change must carry an Unreleased changelog entry
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_check_changelog_coverage.py'
          python3 -B scripts/check-changelog-coverage.py \
            --base "${PR_BASE_SHA}" \
            --head "${PR_HEAD_SHA}" \
            --labels "${PR_LABELS}"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}

  scoring-artifact-identity:
    name: Scoring artifact identity (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # scripts/check-scoring-artifact.py compares the reviewed shadow scoring
      # artifact with the one at the pull request's base commit, so it needs
      # full history rather than the default single-commit checkout.
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # The base SHA is read through the environment, never interpolated into
      # the shell snippet (see the changelog-coverage job above).
      - name: A changed scorer needs a new model identity and a changed artifact a new revision
        run: python3 -B scripts/check-scoring-artifact.py --base "${PR_BASE_SHA}"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  decision-permalinks:
    name: ADR permalink existence (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # scripts/check-decision-permalinks.py resolves each ADR's
      # full_record: commit locally against this repository's own history,
      # so it needs the full history, not the default single-commit checkout
      # the other jobs use.
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Every ADR full_record permalink must name a reachable commit
        run: npm run decision-permalinks:check
