# Repair window: this workflow can repair any commit that is an ancestor of
# the RC branch's current tip (its exact tip included) for which a Release run's
# manifest artifact (release-manifest-<version>) still exists, or that an
# operator names explicitly with the source_commit input. A commit that fell
# out of the RC branch's history -- for example after a force-push or a rebase -- is
# outside that window and reconcile-guard.py refuses it regardless of what a
# manifest claims. See scripts/reconcile-guard.py for the guard this workflow
# defers to, and AGENTS.md's "Release authority" section for the approval
# reconcile still requires before it is dispatched.
#
# Registry publication is not transactional across npm (the wrapper and its
# seven runtime dependency packages), crates.io (two crates), and PyPI (one
# distribution), so a single Release dispatch can leave any subset of those
# ten artifacts unpublished while the rest succeeded
# (`docs/decisions/2026-09-09-release-bindings-in-lockstep.md`). This workflow
# reconciles every one of them, independently, from the exact
# release-manifest-<version> artifact the failed (or partial) run produced:
#
# - the npm wrapper's identity is read from `packages/javascript/package.json`
#   -- the public package that is actually published -- never the private
#   workspace `package.json` at the repository root;
# - each missing npm dependency package is reconciled with
#   `scripts/publish-dependency-package.mjs`, from the exact qualified
#   artifact the original run built, never rebuilt here;
# - `redact-secret-cli` is only published after `redact-secret` (core) is
#   verified, by content checksum, to belong to this source revision --
#   `scripts/reconcile-artifact-plan.py` enforces that ordering so a
#   conflicting or unverifiable core publication can never let a CLI crate
#   ship against it;
# - the PyPI distribution is reconciled from the original run's qualified
#   wheels and source distribution, never rebuilt here.
#
# `dry_run: true` computes and prints every artifact's plan (skip, publish, or
# block) without publishing anything -- the no-publication rehearsal this
# workflow supports for every state transition, the same way
# `package-release-rehearsal.yml` rehearses the npm dependency cutover.
name: Reconcile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to reconcile
        required: true
        type: string
      source_commit:
        description: >-
          Override the release manifest's recorded source commit (only needed
          when no manifest artifact exists for this version).
        required: false
        type: string
      source_run:
        description: Original Release run with qualified artifacts (required when its manifest upload failed)
        required: false
        type: string
      dry_run:
        description: >-
          Compute and print every artifact's reconciliation plan without
          publishing anything.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      source_revision: ${{ steps.guard.outputs.source_revision }}
    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate branch version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF" --version "$VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: '@redact-secret'

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Locate release manifest artifact
        id: locate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          if [[ -n "$SOURCE_RUN" ]]; then
            [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "run_id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=release-manifest-$VERSION&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last // empty')
          if [[ -n "$artifact" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$(jq -r '.workflow_run.id' <<<"$artifact")" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release manifest
        if: steps.locate.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest-${{ inputs.version }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: manifest

      - name: Evaluate reconcile guard
        id: guard
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          manifest_args=()
          if [[ -f manifest/manifest.json ]]; then
            manifest_args=(--manifest manifest/manifest.json)
          fi
          source_args=()
          if [[ -n "$SOURCE_COMMIT" ]]; then
            source_args=(--source-commit "$SOURCE_COMMIT")
          fi

          set +e
          decision=$(python3 -B scripts/reconcile-guard.py \
            "${manifest_args[@]}" \
            --repo . \
            --candidate-ref "$GITHUB_SHA" \
            --version "$VERSION" \
            "${source_args[@]}")
          status=$?
          set -e

          echo "$decision"
          if [[ $status -ne 0 ]]; then
            echo "$(jq -r '.reason' <<<"$decision")" >&2
            exit 1
          fi
          echo "source_revision=$(jq -r '.source_revision' <<<"$decision")" >> "$GITHUB_OUTPUT"

      - name: Verify original run and artifact inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          SOURCE_REVISION: ${{ steps.guard.outputs.source_revision }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > original-run.json
          jq -e --arg sha "$SOURCE_REVISION" '.head_sha == $sha and .path == ".github/workflows/release.yml"' original-run.json
          gh run download "$RUN_ID" --name artifact-inventory --dir original-inventory
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          inventory = json.loads(Path('original-inventory/artifact-inventory.json').read_text())
          assert inventory['sourceCommit'] == os.environ['SOURCE_REVISION']
          assert inventory['productVersion'] == os.environ['VERSION']
          assert inventory['workflowRun'] == os.environ['RUN_ID']
          PYVERIFY
          git show "$SOURCE_REVISION:packages/javascript/package.json" > /tmp/reconcile-package.json
          [[ "$(node -p "require('/tmp/reconcile-package.json').version")" == "$VERSION" ]]

      # Reconciles each of the six native `@redact-secret/node-<platform>`
      # packages and `@redact-secret/wasm` independently
      # (`scripts/reconcile-artifact-plan.py`'s `plan_independent` shape):
      # already-published packages are left alone,
      # `scripts/publish-dependency-package.mjs` republishes nothing whose
      # content differs from this source revision (it fails loudly instead),
      # and a package whose qualified build artifact expired out of the
      # original run blocks with a clear diagnostic rather than guessing at a
      # rebuild.
      - name: Reconcile npm dependency packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          SOURCE_REVISION: ${{ steps.guard.outputs.source_revision }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          declare -A PLATFORM_TARGETS=(
            [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
            [linux-arm64-gnu]=aarch64-unknown-linux-gnu
            [linux-x64-gnu]=x86_64-unknown-linux-gnu
            [win32-arm64-msvc]=aarch64-pc-windows-msvc
            [win32-x64-msvc]=x86_64-pc-windows-msvc
          )

          reconcile_dependency() {
            local package_dir=$1 artifact_name=$2 asset_glob=$3
            git show "$SOURCE_REVISION:$package_dir/package.json" > "$package_dir/package.json"
            local name version tag
            name=$(node -p "require('./$package_dir/package.json').name")
            version=$(node -p "require('./$package_dir/package.json').version")
            if [[ "$version" == *-* ]]; then tag=beta; else tag=latest; fi

            rm -rf "reconcile-artifact/$artifact_name"
            if ! gh run download "$RUN_ID" --name "$artifact_name" --dir "reconcile-artifact/$artifact_name"; then
              echo "$name@$version is not published and its qualified artifact ($artifact_name) is no longer available (expired). A full release run is required to republish it." >&2
              exit 1
            fi
            python3 -B scripts/verify-recovery-artifact.py --inventory original-inventory/artifact-inventory.json --artifact "$artifact_name" --directory "reconcile-artifact/$artifact_name"
            cp reconcile-artifact/"$artifact_name"/$asset_glob "$package_dir/"

            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              node scripts/publish-dependency-package.mjs --package-dir "$package_dir" --tag "$tag" --dry-run
            else
              node scripts/publish-dependency-package.mjs --package-dir "$package_dir" --tag "$tag"
            fi
          }

          for platform in "${!PLATFORM_TARGETS[@]}"; do
            target=${PLATFORM_TARGETS[$platform]}
            reconcile_dependency "bindings/node/npm/$platform" "node-addon-$target" "redact-secret.$platform.node"
          done

          reconcile_dependency "bindings/wasm/npm" "wasm-web" "redact_secret_wasm*"

      # `redact-secret-cli`'s Cargo.toml depends on `redact-secret`'s registry
      # release, so publishing it after only checking crates.io's raw
      # "is a version there" status would let a CLI ship against a core
      # publication nobody verified belongs to this source revision.
      # `cargo package` recreates the exact tarball crates.io would compute
      # for `source_revision` -- publishing is source-based and
      # deterministic, unlike a compiled native addon -- so its SHA-256 is
      # compared against crates.io's recorded checksum before either crate is
      # trusted as "already published and correct".
      - name: Reconcile crates.io
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.guard.outputs.source_revision }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # A clean worktree, not a targeted `git checkout -- <paths>` onto
          # the current tree: the latter only overlays files the historical
          # commit has and never removes ones it doesn't, so a workspace
          # restructured after `source_revision` could leak stray files into
          # the packaged tarball. `cargo package`/`cargo publish` always run
          # against this exact, uncontaminated snapshot instead.
          git worktree add --quiet --detach reconcile-source "$SOURCE_REVISION"
          trap 'git worktree remove --force reconcile-source' EXIT
          manifest_path=reconcile-source/Cargo.toml
          version=$(python3 -B -c "
          import tomllib
          with open('$manifest_path', 'rb') as handle:
              print(tomllib.load(handle)['workspace']['package']['version'])
          ")

          observe() {
            local crate=$1
            local status
            if ! status=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version"); then
              status=000
            fi
            if [[ "$status" == "200" ]]; then
              local published_checksum local_checksum
              published_checksum=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" "https://crates.io/api/v1/crates/$crate/$version" | jq -r '.version.checksum')
              cargo package -p "$crate" --manifest-path "$manifest_path" --locked >/dev/null
              local_checksum=$(sha256sum "reconcile-source/target/package/$crate-$version.crate" | cut -d' ' -f1)
              if [[ "$published_checksum" == "$local_checksum" ]]; then
                jq -n --arg crate "$crate" '{($crate): {live_published: true, content_matches: true}}'
              else
                jq -n --arg crate "$crate" '{($crate): {live_published: true, content_matches: false}}'
              fi
            elif [[ "$status" == "404" ]]; then
              jq -n --arg crate "$crate" '{($crate): {live_published: false, artifact_available: true}}'
            else
              jq -n --arg crate "$crate" --arg status "$status" \
                '{($crate): {live_published: false, registry_observable: false, reason: ("crates.io returned HTTP " + $status)}}'
            fi
          }

          jq -s 'add' <(observe redact-secret) <(observe redact-secret-cli) > crate-observations.json
          cat crate-observations.json

          set +e
          plan=$(python3 -B scripts/reconcile-artifact-plan.py \
            --observations crate-observations.json \
            --crate-pair redact-secret redact-secret-cli)
          plan_status=$?
          set -e
          echo "$plan"

          if [[ $plan_status -ne 0 ]]; then
            echo "crates.io reconciliation refused; see the plan above." >&2
            exit 1
          fi

          core_action=$(jq -r '."redact-secret".action' <<<"$plan")
          cli_action=$(jq -r '."redact-secret-cli".action' <<<"$plan")

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry run: core=$core_action cli=$cli_action; publishing nothing."
            exit 0
          fi

          if [[ "$core_action" == "publish" ]]; then
            cargo publish -p redact-secret --manifest-path "$manifest_path" --locked
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -sS -A "redact-secret-release (https://github.com/redact-secret/redact-secret)" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/redact-secret/$version")
              [[ "$status" == "200" ]] && break
              sleep 10
            done
          fi
          if [[ "$cli_action" == "publish" ]]; then
            cargo publish -p redact-secret-cli --manifest-path "$manifest_path" --locked
          fi

      # The PyPI distribution's build (wheels + source distribution) is never
      # rebuilt here -- it is downloaded from the same original run the
      # release manifest came from, the same "never rebuilt" rule
      # `reconcile npm dependency packages` follows, because a rebuild is not
      # guaranteed to reproduce byte-identical wheels.
      - name: Reconcile PyPI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
          SOURCE_REVISION: ${{ steps.guard.outputs.source_revision }}
        run: |
          set -euo pipefail
          # A clean worktree of `source_revision`, the same reasoning
          # `Reconcile crates.io` uses: only the version number needs to come
          # from that exact commit, so it is read straight out of the
          # worktree's `Cargo.toml` rather than mutating the live checkout.
          git worktree add --quiet --detach reconcile-source "$SOURCE_REVISION"
          trap 'git worktree remove --force reconcile-source' EXIT

          read -r name version < <(python3 -B -c "
          import importlib.util
          import tomllib
          spec = importlib.util.spec_from_file_location('qualify_python_wheel', 'scripts/qualify-python-wheel.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with open('reconcile-source/Cargo.toml', 'rb') as handle:
              cargo_version = tomllib.load(handle)['workspace']['package']['version']
          print(module.policy()['python-distribution'], module.pep440_version(cargo_version))
          ")

          python3 -B scripts/verify-recovery-artifact.py \
            --inventory original-inventory/artifact-inventory.json \
            --pypi "$name" \
            --version "$version" \
            --pypi-report pypi-state.json
          pypi_status=$(python3 -B -c "import json; print(json.load(open('pypi-state.json'))['status'])")
          if [[ "$pypi_status" == "complete" ]]; then
            echo "$name@$version matches every qualified file on PyPI; nothing to reconcile."
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf reconcile-dist && mkdir -p reconcile-dist
          if ! gh run download "$RUN_ID" --dir reconcile-dist --pattern 'python-*'; then
            echo "$name@$version is not published and its qualified wheels/sdist are no longer available (expired). A full release run is required to republish it." >&2
            exit 1
          fi
          find reconcile-dist -mindepth 2 -type f -exec mv -t reconcile-dist {} +
          find reconcile-dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          python3 -B scripts/verify-recovery-artifact.py \
            --inventory original-inventory/artifact-inventory.json \
            --pypi-report pypi-state.json \
            --stage-pypi-missing reconcile-dist

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "dry run: would publish $(find reconcile-dist -type f | wc -l) file(s) to PyPI as $name@$version."
            find reconcile-dist -maxdepth 1 -type f -printf 'dry run: missing PyPI file %f\n' | sort
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "needs_publish=true" >> "$GITHUB_OUTPUT"
        id: pypi

      # Trusted publishing (OIDC, `permissions.id-token: write` above), the
      # same mechanism `release.yml`'s `publish-pypi` job uses.
      # `skip-existing: true` makes this idempotent against a file PyPI
      # already has, mirroring the immutable-artifact check every other
      # reconciled registry performs explicitly.
      - name: Publish to PyPI
        if: steps.pypi.outputs.needs_publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: reconcile-dist/
          skip-existing: true

      - name: Reconcile npm facade
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.guard.outputs.source_revision }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git worktree add --quiet --detach reconcile-wrapper "$SOURCE_REVISION"
          trap 'git worktree remove --force reconcile-wrapper' EXIT
          registry_reader="$PWD/scripts/npm-registry-metadata.mjs"
          cd reconcile-wrapper
          npm ci --ignore-scripts
          npm run js:build
          npm pack ./packages/javascript --json > packed.json
          tarball=$(jq -r '.[0].filename' packed.json)
          expected=$(jq -r '.[0].shasum' packed.json)
          name=$(node -p "require('./packages/javascript/package.json').name")
          version=$(node -p "require('./packages/javascript/package.json').version")
          if [[ "$version" == *-* ]]; then npm_tag=beta; else npm_tag=latest; fi
          published=$(node "$registry_reader" "$name" "$version")
          if [[ "$published" != unpublished ]]; then
            [[ "$published" == "$expected" ]] || { echo 'Existing npm facade conflicts with original source.' >&2; exit 1; }
          elif [[ "$DRY_RUN" == "true" ]]; then
            npm publish --dry-run --access public --tag "$npm_tag" "$tarball"
          else
            npm publish --access public --tag "$npm_tag" "$tarball"
            node "$registry_reader" "$name" "$version" "$expected"
          fi

  verify-registry-install:
    name: Verify registry install ${{ matrix.target }}
    needs: reconcile
    if: inputs.dry_run == false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.reconcile.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use current registry verification tooling
        shell: bash
        run: git show "$GITHUB_SHA:scripts/verify-registry-install.mjs" > scripts/verify-registry-install.mjs

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # `consumer-harness.mjs` imports `esbuild` unconditionally (the browser
      # lane needs it); the node lane below never calls it, but still needs
      # it importable.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the registry-backed clean install
        run: node scripts/verify-registry-install.mjs --lane node

  verify-registry-install-browser:
    name: Verify registry install (browser)
    needs: reconcile
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.reconcile.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use current registry verification tooling
        shell: bash
        run: git show "$GITHUB_SHA:scripts/verify-registry-install.mjs" > scripts/verify-registry-install.mjs

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the registry-backed clean install
        run: node scripts/verify-registry-install.mjs --lane browser

  tag-reconciled-release:
    name: Tag reconciled release
    needs: [reconcile, verify-registry-install, verify-registry-install-browser]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Require a release candidate branch
        if: ${{ !startsWith(github.ref, 'refs/heads/rc/') }}
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate branch version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -B scripts/check-release-refs.py --candidate-ref "$GITHUB_REF" --version "$VERSION"
      - name: Tag verified source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ needs.reconcile.outputs.source_revision }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag_name="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            [[ "$(git rev-list -n 1 "$tag_name")" == "$SOURCE_REVISION" ]]
            [[ "$(git cat-file -t "$tag_name")" == tag ]]
            exit 0
          fi
          tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            --field tag="$tag_name" --field message="Release $VERSION" \
            --field object="$SOURCE_REVISION" --field type=commit --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --field ref="refs/tags/$tag_name" --field sha="$tag_object"
