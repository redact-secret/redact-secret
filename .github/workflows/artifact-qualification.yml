name: Artifact qualification

# Qualifies every supported artifact of the product from one commit, and
# publishes nothing (`decision-release-bindings-in-lockstep`).
#
# Six families, all from the same revision: the Rust workspace (format, lint,
# tests, MSRV, canonical conformance, wasm32) by way of the `CI` workflow; the
# CPython abi3 wheels and source distribution by way of the `Python wheels`
# workflow; the N-API addon for every triple in `node-addon-targets`; the
# browser WebAssembly artifact in every engine in `browser-engines`; the CLI
# binary for every triple in `cli-release-targets`; clean installed-package
# streaming checks across every declared Node major and browser engine; the
# Node WebAssembly fallback and Cloudflare Workers paths; and finally one
# inventory job that records what was produced and qualified,
# tied to the source commit.
#
# `[workspace.metadata.redact-secret]` in the root Cargo.toml is the single
# declaration of those matrices, and `scripts/check-artifact-matrix.py`
# (the `policy` job below, which everything else waits on) fails when this
# file, `bindings/node/package.json`, or any manifest declaring
# `engines.node` disagrees with it.
#
# The CLI ships no musl variant, so `cli-release-targets` is six triples
# where `node-addon-targets` is eight; the two are declared separately for
# exactly that reason.
#
# Issue #511 (A10) adds a `support-matrix-drift` gate alongside those artifact
# families: it compares the pinned `benchmarks/support-matrix.json` against
# the most recent prior release's, entirely offline, and fails the run on an
# unacknowledged regression out of `stable`. It informs the release decision;
# it does not itself grant authority to tag, publish, or release.
#
# On pull requests only the matrix's own machinery triggers a run: the full
# fan-out is expensive, and every commit that reaches `main` runs it in full.
#
# `release.yml` calls this workflow (`workflow_call`) before publishing and
# consumes the `node-addon-<target>`, `wasm-web`, `wasm-web-common` and
# `cli-<target>` artifacts it uploads, so a release ships the exact binaries
# qualified here rather than rebuilding them
# (`decision-ship-first-release-artifact-set`).

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - "rc/*"
  pull_request:

permissions: {}

concurrency:
  group: artifact-qualification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pull requests otherwise expose the synthesized merge SHA, not the head
  # revision whose qualification evidence reviewers need to identify.
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # Must match the `wasm-bindgen` version in Cargo.toml exactly: glue built
  # by a different CLI version cannot instantiate the module.
  WASM_BINDGEN_VERSION: "0.2.128"

jobs:
  plan:
    name: Artifact qualification run plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      pr: ${{ steps.plan.outputs.pr }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether this pull request needs full qualification
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          full=true
          pr=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            full=false
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/artifact-qualification.yml|Cargo.toml|Cargo.lock)
                  pr=true
                  break
                  ;;
                bindings/node/package.json|bindings/node/npm/*|bindings/wasm/*)
                  pr=true
                  break
                  ;;
                crates/secret-scan-cli/*|crates/secret-scan-core/*|examples/safe-integration/*)
                  pr=true
                  break
                  ;;
                packages/javascript/*|conformance/*)
                  pr=true
                  break
                  ;;
                scripts/browser-harness.mjs|scripts/browser-package-harness.mjs|scripts/build-browser-artifact.mjs)
                  pr=true
                  break
                  ;;
                scripts/check-artifact-matrix.py|scripts/consumer-harness.mjs|scripts/qualify-browser-artifact.mjs)
                  pr=true
                  break
                  ;;
                scripts/qualify-cli-binary.mjs|scripts/qualify-node-addon.mjs|scripts/qualify-package-consumer.mjs)
                  pr=true
                  break
                  ;;
                scripts/qualify-runtime-fixture.mjs|scripts/record-artifact-inventory.py)
                  pr=true
                  break
                  ;;
                scripts/qualify-node-wasm-fallback.mjs|scripts/qualify-workerd-artifact.mjs)
                  pr=true
                  break
                  ;;
                scripts/tests/test_check_artifact_matrix.py|scripts/tests/test_record_artifact_inventory.py)
                  pr=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          {
            echo "full=$full"
            echo "pr=$pr"
          } >> "$GITHUB_STEP_SUMMARY"

  policy:
    name: Artifact matrix policy
    runs-on: ubuntu-latest
    needs: plan
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that every declared matrix matches this workflow
        run: |
          python3 -B -m unittest discover -s scripts/tests \
            -p 'test_check_artifact_matrix.py'
          python3 -B -m unittest discover -s scripts/tests \
            -p 'test_record_artifact_inventory.py'
          python3 -B scripts/check-artifact-matrix.py

  support-matrix-drift:
    name: Support-matrix drift
    runs-on: ubuntu-latest
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Issue #511: the baseline is the most recent prior release's own
      # pinned `benchmarks/support-matrix.json`, read straight out of git
      # history -- local, offline, and deterministic (acceptance criterion
      # 3). No previous release tag carrying that file is this repository's
      # bootstrap state (it was only added by issue #510) and every first
      # release after a genuinely new taxonomy would hit it again -- both are
      # "nothing to regress from yet", not a gate failure.
      - name: Resolve the previous release's pinned support matrix
        id: baseline
        shell: bash
        run: |
          previous_tag=$(git tag --list 'v*' --sort=-v:refname --merged HEAD | head -n1 || true)
          if [[ -z "$previous_tag" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous release tag found; skipping the support-matrix drift gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git show "$previous_tag:benchmarks/support-matrix.json" > baseline-support-matrix.json 2>/dev/null; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "$previous_tag predates benchmarks/support-matrix.json; skipping the support-matrix drift gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Check support-matrix drift against the previous release
        if: steps.baseline.outputs.found == 'true'
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_check_support_matrix_drift.py'
          python3 -B scripts/check-support-matrix-drift.py \
            --baseline baseline-support-matrix.json \
            --out support-matrix-drift.json

      - name: Record an empty drift record when no baseline exists yet
        if: steps.baseline.outputs.found != 'true'
        run: echo '{}' > support-matrix-drift.json

      # `if: always()` so a run this gate fails -- `check-support-matrix-drift.py`
      # writes `support-matrix-drift.json` before evaluating whether any
      # regression is unacknowledged -- still uploads the record `release.yml`'s
      # `record-manifest` embeds into the durable manifest (acceptance criterion 1).
      - name: Upload the support-matrix drift record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: support-matrix-drift
          path: support-matrix-drift.json
          if-no-files-found: error

  rust:
    name: Rust
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  python:
    name: Python
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml

  node-addon:
    name: Addon ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            smoke: host
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            smoke: host
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            smoke: alpine
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            smoke: alpine
          - target: x86_64-apple-darwin
            # `macos-13` was the last standard Intel image and was retired on
            # 2025-12-04; `macos-15-intel` is its standard-size replacement.
            runner: macos-15-intel
            smoke: host
          - target: aarch64-apple-darwin
            runner: macos-latest
            smoke: host
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: host
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            smoke: host

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up the floor Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Set up stable Rust with the addon target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: addon-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the addon build toolchain
        if: matrix.smoke == 'host'
        working-directory: bindings/node
        run: npm ci --ignore-scripts

      - name: Build the JavaScript package
        run: npm run js:build

      - name: Build the addon
        if: matrix.smoke == 'host'
        working-directory: bindings/node
        shell: bash
        run: npx napi build --platform --release --target "${{ matrix.target }}"

      # Issue #614: beta.6's rehearsal and release qualified different
      # Windows `.node` bytes for the same source. `.cargo/config.toml`
      # links MSVC targets deterministically; this relinks the addon crate
      # (a fresh link is where a timestamp or PDB signature would differ)
      # and fails if the rebuilt bytes diverge from the first build's.
      - name: Verify the Windows addon build is reproducible
        if: contains(matrix.target, 'windows-msvc')
        working-directory: bindings/node
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          addons=(*.node)
          [[ ${#addons[@]} -eq 1 ]] || { echo "expected exactly one built addon, found: ${addons[*]}" >&2; exit 1; }
          addon=${addons[0]}
          first=$(sha256sum "$addon" | cut -d' ' -f1)
          cargo clean --release --target "$TARGET" -p redact-secret-node
          npx napi build --platform --release --target "$TARGET"
          second=$(sha256sum "$addon" | cut -d' ' -f1)
          if [[ "$first" != "$second" ]]; then
            echo "::error::$TARGET addon is not reproducible: first build $first, rebuild $second" >&2
            exit 1
          fi
          echo "$TARGET addon rebuilt byte-identically (sha256 $first)."

      # The addon is a cdylib, and `musl-tools` cannot link one: its gcc
      # wrapper ships no musl `libgcc_s.so.1`, and routing rustc's
      # self-contained objects through the glibc driver instead produces a
      # library that links and then segfaults on load. So a musl addon is
      # built natively, in a musl image of the same architecture, where the
      # host triple already is the target and the system `cc` is the musl
      # one. `napi` would otherwise look for a `<triple>-gcc` cross linker
      # that does not exist there. The container runs as root because `apk`
      # needs to, so the workspace is handed back afterwards.
      - name: Build the addon on musl
        if: matrix.smoke == 'alpine'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          linker=$(printf '%s' "CARGO_TARGET_${TARGET}_LINKER" | tr '[:lower:]-' '[:upper:]_')
          docker run --rm -v "$PWD:/io" -w /io/bindings/node \
            -e HOME=/tmp -e "$linker=cc" rust:1-alpine sh -c '
              apk add --no-cache nodejs npm >/dev/null &&
              npm ci --ignore-scripts >/dev/null &&
              npx napi build --platform --release
            '
          sudo chown -R "$(id -u):$(id -g)" bindings/node target

      # One artifact has to serve every Node.js major `engines.node` claims,
      # so each is set up in turn and qualifies the same built addon. The
      # majors below are `node-support-majors`.
      - name: Qualify the addon on Node 20
        if: matrix.smoke == 'host'
        run: node scripts/qualify-node-addon.mjs --target ${{ matrix.target }}

      # One compiled addon exposes both profiles (unlike the WASM artifact,
      # which is one profile per build), so its `common` exports only need
      # qualifying once per target rather than on every Node major above --
      # the majors above already prove the addon loads and runs on each
      # runtime; this proves the same compiled binary's `common` surface
      # (`decision-define-detector-profile-and-pack-contract`, issue #382).
      - name: Qualify the addon's common profile
        if: matrix.smoke == 'host'
        run: node scripts/qualify-node-addon.mjs --target ${{ matrix.target }} --detector-profile common

      - name: Set up Node 22
        if: matrix.smoke == 'host'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Qualify the addon on Node 22
        if: matrix.smoke == 'host'
        run: node scripts/qualify-node-addon.mjs --target ${{ matrix.target }}

      - name: Set up Node 24
        if: matrix.smoke == 'host'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Qualify the addon on Node 24
        if: matrix.smoke == 'host'
        run: node scripts/qualify-node-addon.mjs --target ${{ matrix.target }}

      # A musl addon cannot be loaded by the glibc runner's Node.js, so it is
      # qualified inside a musl image of the same architecture, on every
      # supported major. `--user` keeps the mounted tree free of root-owned
      # files the later upload step would have to read.
      - name: Qualify the addon on musl
        if: matrix.smoke == 'alpine'
        run: |
          for major in 20 22 24; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/io" -w /io "node:${major}-alpine" \
              node scripts/qualify-node-addon.mjs --target ${{ matrix.target }}
          done

      # Same "once per target, not per major" reasoning as the host leg above.
      - name: Qualify the addon's common profile on musl
        if: matrix.smoke == 'alpine'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/io" -w /io node:20-alpine \
            node scripts/qualify-node-addon.mjs --target ${{ matrix.target }} --detector-profile common

      - name: Upload the addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-addon-${{ matrix.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts
          if-no-files-found: error

  browser:
    name: Browser ${{ matrix.engine }}
    runs-on: ubuntu-latest
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser-artifact

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked

      - name: Build the browser artifact
        run: npm run wasm:build

      # The `common` profile artifact (`decision-define-detector-profile-and-pack-contract`,
      # issue #382): a second, smaller WebAssembly build qualified the same
      # way and, on the chromium leg only, uploaded alongside the full
      # artifact so `release.yml` can publish both from this one revision.
      - name: Build the common browser artifact
        run: npm run wasm:build:common

      # The second page drives the published package on top of that
      # artifact, so its compiled entry point has to exist.
      - name: Build the JavaScript package
        run: npm run js:build

      - name: Install the browser engine
        run: npx playwright install --with-deps ${{ matrix.engine }}

      - name: Qualify the browser artifact
        run: node scripts/qualify-browser-artifact.mjs --engine ${{ matrix.engine }}

      - name: Qualify the common browser artifact
        run: node scripts/qualify-browser-artifact.mjs --engine ${{ matrix.engine }} --detector-profile common

      - name: Upload the browser artifact
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-web
          path: bindings/wasm/pkg/
          if-no-files-found: error

      - name: Upload the common browser artifact
        if: matrix.engine == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-web-common
          path: bindings/wasm/pkg-common/
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs:
      - plan
      - policy
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Set up stable Rust with the CLI target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cli-${{ matrix.target }}

      - name: Build the CLI
        run: cargo build --release --locked -p redact-secret-cli --target ${{ matrix.target }}

      - name: Qualify the CLI
        run: node scripts/qualify-cli-binary.mjs --target ${{ matrix.target }}

      - name: Upload the CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/redact-secret
            target/${{ matrix.target }}/release/redact-secret.exe
          if-no-files-found: error

  pr-macos-smoke:
    name: PR macOS artifact smoke
    runs-on: macos-latest
    needs:
      - plan
      - policy
    if: needs.plan.outputs.pr == 'true'
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up the floor Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: npm

      - name: Set up stable Rust with the macOS ARM target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: pr-macos-artifacts

      - name: Install repository and addon dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix bindings/node ci --ignore-scripts

      - name: Build the JavaScript package
        run: npm run js:build

      - name: Build and qualify the macOS addon
        working-directory: bindings/node
        run: |
          npx napi build --platform --release --target aarch64-apple-darwin
          cd ../..
          node scripts/qualify-node-addon.mjs --target aarch64-apple-darwin

      - name: Build and qualify the macOS CLI
        run: |
          cargo build --release --locked -p redact-secret-cli --target aarch64-apple-darwin
          node scripts/qualify-cli-binary.mjs --target aarch64-apple-darwin

  package-consumer-node:
    name: Installed Node package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [plan, node-addon, browser]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the JavaScript package
        run: npm run js:build

      # This runner's own addon, already built and smoke-tested by the
      # `node-addon` matrix above -- reused here rather than rebuilt. The
      # published platform package's `main` is this `.node` file directly
      # (`npm/<platform>/package.json`); Node's loader opens a `.node` file
      # itself, so nothing here needs napi's generated `index.js`.
      - name: Download this host's Node addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-addon-x86_64-unknown-linux-gnu
          path: bindings/node

      # The `browser` job's own qualified build, reused here rather than
      # rebuilt.
      - name: Download the qualified wasm-bindgen build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: dist/wasm-web

      - name: Qualify installed incremental and Node stream APIs
        run: |
          node scripts/qualify-package-consumer.mjs \
            --lane node \
            --wasm-dir dist/wasm-web \
            --report installed-javascript-node-${{ matrix.node-version }}.json

      - name: Upload installed Node qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-javascript-node-${{ matrix.node-version }}
          path: installed-javascript-node-${{ matrix.node-version }}.json
          if-no-files-found: error

  package-consumer-browser:
    name: Installed browser package (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: [plan, node-addon, browser]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the JavaScript package
        run: npm run js:build

      - name: Download this host's Node addon
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-addon-x86_64-unknown-linux-gnu
          path: bindings/node

      - name: Download the qualified wasm-bindgen build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: dist/wasm-web

      - name: Install Playwright's ${{ matrix.engine }}
        run: npx playwright install --with-deps "${{ matrix.engine }}"

      - name: Qualify installed incremental and Web stream APIs
        run: |
          node scripts/qualify-package-consumer.mjs \
            --lane browser \
            --engine "${{ matrix.engine }}" \
            --wasm-dir dist/wasm-web \
            --report installed-javascript-browser-${{ matrix.engine }}.json

      - name: Upload installed browser qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-javascript-browser-${{ matrix.engine }}
          path: installed-javascript-browser-${{ matrix.engine }}.json
          if-no-files-found: error

  # The Node WebAssembly fallback (`decision-add-node-wasm-fallback`) and the
  # Cloudflare Workers path (`decision-verify-edge-runtimes`) run the
  # `browser` job's builds rather than an artifact of their own, so both are
  # qualified here against exactly those builds, for both detector profiles.
  # No native addon is downloaded, so Node has to take the fallback; Workers
  # runs in a real local `workerd` through `wrangler dev`.
  package-consumer-wasm-runtimes:
    name: Node WebAssembly fallback and Cloudflare Workers
    runs-on: ubuntu-latest
    needs: [plan, browser]
    if: needs.plan.outputs.full == 'true'
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the JavaScript package
        run: npm run js:build

      - name: Download the qualified wasm-bindgen build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: dist/wasm-web

      - name: Download the qualified common wasm-bindgen build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web-common
          path: dist/wasm-web-common

      - name: Qualify the Node WebAssembly fallback
        run: |
          node scripts/qualify-node-wasm-fallback.mjs --wasm-dir dist/wasm-web
          node scripts/qualify-node-wasm-fallback.mjs --wasm-dir dist/wasm-web-common --detector-profile common

      # One step per profile: each starts its own `wrangler dev`, so a hang
      # names the profile that caused it instead of the pair.
      - name: Qualify the Cloudflare Workers runtime path
        run: node scripts/qualify-workerd-artifact.mjs --wasm-dir dist/wasm-web

      - name: Qualify the Cloudflare Workers runtime path (common profile)
        run: node scripts/qualify-workerd-artifact.mjs --wasm-dir dist/wasm-web-common --detector-profile common

  inventory:
    name: Artifact inventory
    runs-on: ubuntu-latest
    needs:
      - plan
      - policy
      - rust
      - python
      - node-addon
      - browser
      - cli
      - pr-macos-smoke
      - package-consumer-node
      - package-consumer-browser
      - package-consumer-wasm-runtimes
    if: always()
    permissions:
      contents: read

    steps:
      - name: Require planning and policy jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          for result in "$PLAN_RESULT" "$POLICY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Artifact inventory cannot pass because a required setup job finished with '$result'." >&2
              exit 1
            fi
          done

      - name: Accept a pull request that did not touch artifact inputs
        if: needs.plan.outputs.full != 'true' && needs.plan.outputs.pr != 'true'
        run: echo "Artifact qualification skipped; this pull request did not touch artifact inputs." >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful pull request artifact smoke
        if: needs.plan.outputs.pr == 'true'
        env:
          PR_MACOS_RESULT: ${{ needs.pr-macos-smoke.result }}
        run: |
          if [[ "$PR_MACOS_RESULT" != "success" ]]; then
            echo "Artifact inventory cannot pass because PR macOS smoke finished with '$PR_MACOS_RESULT'." >&2
            exit 1
          fi

      - name: Require successful qualification jobs
        if: needs.plan.outputs.full == 'true'
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          ADDON_RESULT: ${{ needs.node-addon.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          NODE_CONSUMER_RESULT: ${{ needs.package-consumer-node.result }}
          BROWSER_CONSUMER_RESULT: ${{ needs.package-consumer-browser.result }}
          WASM_RUNTIMES_RESULT: ${{ needs.package-consumer-wasm-runtimes.result }}
        run: |
          for result in \
            "$POLICY_RESULT" \
            "$RUST_RESULT" \
            "$PYTHON_RESULT" \
            "$ADDON_RESULT" \
            "$BROWSER_RESULT" \
            "$CLI_RESULT" \
            "$NODE_CONSUMER_RESULT" \
            "$BROWSER_CONSUMER_RESULT" \
            "$WASM_RUNTIMES_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Artifact inventory cannot pass because an upstream job finished with '$result'." >&2
              exit 1
            fi
          done

      - name: Check out repository
        if: needs.plan.outputs.full == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: needs.plan.outputs.full == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        if: needs.plan.outputs.full == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install dependencies
        if: needs.plan.outputs.full == 'true'
        run: npm ci --ignore-scripts

      - name: Build the JavaScript package
        if: needs.plan.outputs.full == 'true'
        run: npm run js:build

      - name: Download every artifact this run produced
        if: needs.plan.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: qualification-artifacts

      # Issue #528: every other artifact family qualified in this workflow is
      # built exactly once, here, and the Node addon, browser, CLI, and
      # Python jobs all upload what they built for `record-artifact-inventory.py`
      # to hash. Neither crate was ever built before it reached the registry --
      # `crate_contents()` only ever ran `cargo package --list`, which packages
      # nothing -- so `cargo publish` was the first (and only) build of the
      # bytes crates.io received, with nothing to compare them against.
      # `--no-verify` skips extracting the package and compiling it in
      # isolation: `redact-secret-cli` declares `redact-secret` as a registry
      # dependency (`decision-ship-first-release-artifact-set`), which cannot
      # resolve until `redact-secret` is actually live on crates.io, so that
      # verify build fails this early in the run regardless of whether the
      # packaged bytes are correct. Skipping it does not change the `.crate`
      # tarball `cargo package` writes to `target/package/`, only whether it
      # also compiles the extracted copy.
      #
      # Both crates are packaged in one invocation. `--no-verify` still has
      # to resolve the CLI's dependencies to write the `Cargo.lock` it ships,
      # and on a freshly bumped RC the exact `=<version>` core requirement is
      # not on crates.io yet, so a separate `-p redact-secret-cli` run fails
      # there (it only passed on `main`, whose version was already
      # published). Packaged together, Cargo resolves the CLI against the
      # core `.crate` it just wrote, recorded as a crates.io source whose
      # checksum is that file's SHA-256 -- the same bytes `release.yml`'s
      # `publish-crates` job verifies crates.io received before it publishes
      # the CLI, so the CLI tarball recorded here is the one it reproduces.
      - name: Package the crates
        if: needs.plan.outputs.full == 'true'
        run: cargo package --no-verify --locked -p redact-secret -p redact-secret-cli

      # Requires the whole declared matrix, records every artifact's size and
      # SHA-256 against the source commit, and lists the contents of each
      # package a release would publish. No publication happens here.
      - name: Record the artifact inventory
        if: needs.plan.outputs.full == 'true'
        env:
          # On a pull request `github.sha` is the synthesized merge commit,
          # which no clone can resolve; the head commit is the revision the
          # artifacts were actually built from.
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B scripts/record-artifact-inventory.py \
            --artifacts qualification-artifacts \
            --out artifact-inventory.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact inventory
        if: needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-inventory
          path: artifact-inventory.json
          if-no-files-found: error
