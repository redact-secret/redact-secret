# The wiki has the largest cross-repository link exposure and no CI of its
# own, so a scheduled job here clones it and runs the same checker
# (docs/specs/evidence-and-gates.md, "Cross-repository links"). A broken
# wiki link fails this run; nothing else would notice it.
name: Wiki links

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  wiki-links:
    name: Wiki cross-repository links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check out the wiki
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          persist-credentials: false

      - name: Every cross-repository link in the wiki must resolve
        run: python3 -B scripts/check-cross-repository-links.py --scan-dir wiki
