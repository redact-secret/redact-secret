title: "[idea] "
body:
  - type: markdown
    attributes:
      value: |
        Float an early provider/family request or feature idea before it is
        concrete. 아직 구체적이지 않은 아이디어를 자유롭게 남겨주세요. When it becomes concrete
        enough for a public format link and a use case, convert it to a
        [Request sensitive-data support](https://github.com/redact-secret/redact-secret/issues/new?template=request-detector.yml)
        issue instead.

        Do not paste any real, revoked-but-real, or real-derived credential or
        real personal data here — this board has no automatic scan.

  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true

  - type: checkboxes
    id: safety-ack
    attributes:
      label: Safety acknowledgement
      options:
        - label: >-
            I have not included any real, revoked-but-real, or real-derived
            credential, or any real personal data, in this post.
          required: true
