blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/redact-secret/redact-secret/security/advisories/new
    about: Report a suspected vulnerability privately. Do not use a public issue.
  - name: Questions and ideas
    url: https://github.com/redact-secret/redact-secret/discussions
    about: Ask a usage question or float an early idea.
  - name: Propose a provider for credential research (researchers)
    url: https://github.com/redact-secret/redact-secret-benchmarks/issues/new?template=suggest-research.yml
    about: Optional, for researchers who already know a provider's credential format. If you only want something detected, use "Request sensitive-data support" here instead.
  - name: Reporting guide (optional)
    url: https://github.com/redact-secret/redact-secret/blob/main/docs/guides/reporting-detection-issues.md
    about: Optional help for writing a safe synthetic example. You do not need to read it to file a report.
