name: Request sensitive-data support / 탐지 지원 요청
description: Ask for a credential type or a kind of personal data to be detected.
title: "[support request] "
labels:
  - area:detectors
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you would like Redact Secret to detect. A provider or
        data-type name is enough. 탐지하고 싶은 자격 증명이나 개인정보 종류의 이름만 알려주셔도 됩니다.

        **Never paste real data.** No live, revoked-but-real, or real-derived
        credentials, personal data, customer logs, screenshots, or prompt or
        tool exports. Describe the format in words or link to public
        documentation instead.

        This opens an intake issue. A request does not promise support, and you
        do not need to know how detectors are researched or classified. A
        maintainer decides whether it is research-needed or implementation-ready
        and routes it internally. For a suspected security vulnerability use
        [private reporting](https://github.com/redact-secret/redact-secret/security/advisories/new),
        not this form.

  - type: input
    id: provider-or-entity
    attributes:
      label: Provider or data type
      description: A public name is enough; do not include an actual value.
      placeholder: "Example Provider API token, or national ID number"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: What kind is it? (optional)
      description: Pick the closest, or leave it blank if unsure.
      options:
        - Credential issued by a provider
        - Generic or contextual credential
        - Personal data
        - Not sure
    validations:
      required: false

  - type: textarea
    id: use-case
    attributes:
      label: Where does it appear? (optional)
      description: For example a prompt, tool result, log, or trace. No production data.
      placeholder: "Users paste configuration into an assistant, and tokens may enter model context."
    validations:
      required: false

  - type: input
    id: public-docs
    attributes:
      label: Public documentation link (optional)
      description: Prefer official documentation. Leave blank if you cannot find one.
      placeholder: "https://provider.example/docs/tokens"
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Before submitting
      options:
        - label: I have not included real credentials, real-derived credentials, personal data, or unsanitized customer material.
          required: true
