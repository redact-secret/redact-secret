name: False positive report
description: A value was flagged or redacted but should not have been.
title: "[false-positive] "
labels:
  - area:conformance
body:
  - type: markdown
    attributes:
      value: |
        Tell us about a value that was flagged or redacted but should not have
        been. A short description is enough to start; maintainers can ask for
        more. 영어와 한국어 모두 가능합니다.

        **Never paste real data.** No live, revoked-but-real, or real-derived
        credentials (not even truncated or partly masked), personal data,
        customer logs, or unsanitized screenshots, prompt exports, or tool
        payloads. Write an independently made synthetic example with the same
        shape instead. The
        [reporting guide](https://github.com/redact-secret/redact-secret/blob/main/docs/guides/reporting-detection-issues.md)
        is optional help for that; you do not need to read it first.

        Filing this does not by itself change any fixture or confirm a defect.
        Maintainers route accepted reports internally. For a suspected
        security vulnerability use
        [private reporting](https://github.com/redact-secret/redact-secret/security/advisories/new).

  - type: textarea
    id: repro-shape
    attributes:
      label: Synthetic example
      description: >-
        Paste or describe an independently made synthetic value with the same
        prefix, length, and character set as the real one, never the real value
        or an edited copy of it. If it depends on nearby text, describe that
        context with placeholders.
      render: text
    validations:
      required: true

  - type: dropdown
    id: expected-action
    attributes:
      label: What should have happened? (optional)
      options:
        - "No finding at all (allow)"
        - "warn instead of redact"
        - "warn instead of block"
        - "redact instead of block"
        - "Other (describe above)"
    validations:
      required: false

  - type: input
    id: family
    attributes:
      label: Provider or detector family (optional)
      description: The detector id or provider, if you know it (for example `github-token`). Leave blank if unsure.
      placeholder: "github-token"
    validations:
      required: false

  - type: dropdown
    id: runtime
    attributes:
      label: Where did you run it? (optional)
      options:
        - JavaScript (Node.js)
        - JavaScript (browser)
        - Python
        - Command line
        - Rust
        - Other / not sure
    validations:
      required: false

  - type: input
    id: package-version
    attributes:
      label: Package version (optional)
      description: For example `@redact-secret/core@0.1.0-beta.14`, or a commit SHA. Leave blank if unsure.
      placeholder: "0.1.0-beta.14"
    validations:
      required: false

  - type: checkboxes
    id: safety-ack
    attributes:
      label: Safety acknowledgement
      options:
        - label: >-
            I have not included any live, revoked-but-real, or real-derived
            credential or personal data anywhere in this report or its attachments.
          required: true
        - label: >-
            Any log, screenshot, prompt export, or tool payload I attached has
            been manually reviewed and sanitized by me.
          required: false
