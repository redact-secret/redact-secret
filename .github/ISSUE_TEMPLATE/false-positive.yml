name: False positive report
description: A scanned value was flagged or redacted but should not have been.
title: "[false-positive] "
labels:
  - area:conformance
body:
  - type: markdown
    attributes:
      value: |
        Read the [reporting guide](https://github.com/redact-secret/redact-secret/blob/main/docs/guides/reporting-detection-issues.md)
        before filing. In short:

        - **Never** paste a live, revoked-but-real, or real-derived credential
          here, even truncated or partially masked. Build an independently
          authored synthetic equivalent instead — the guide shows how.
        - Raw logs, screenshots, prompt exports, and tool payloads are
          discouraged unless you have personally reviewed and sanitized every
          line yourself.
        - Filing this form does not by itself change any conformance fixture
          or open a confirmed defect. Accepted reports enter the governed
          known-gap lifecycle in `redact-secret-benchmarks`
          (`observed → reviewed → promoted → fixed → verified`) before any
          fixture or expected result changes.
        - Redact Secret collects no telemetry automatically; you are sharing
          this information manually.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: >-
        Exact published version or commit, e.g. `@redact-secret/core@0.1.0-beta.6`,
        `redact-secret==0.1.0b6`, `redact-secret-cli 0.1.0-beta.6`, or a commit SHA.
      placeholder: "0.1.0-beta.6"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: >-
        Binding plus runtime/OS, e.g. "Node 20.11 on Linux x64",
        "Python 3.12 CPython on macOS arm64", "browser WebAssembly, Chrome 128",
        or "CLI, Rust 1.79".
      placeholder: "Node 20.11 on Linux x64"
    validations:
      required: true

  - type: input
    id: family
    attributes:
      label: Detector family (if known)
      description: >-
        The detector id or provider family, if known (e.g. `github-token`,
        `aws`, `generic-token`). Leave blank if you don't know it.
      placeholder: "github-token"
    validations:
      required: false

  - type: dropdown
    id: expected-action
    attributes:
      label: Expected action
      description: What the scanner should have done with this value instead.
      options:
        - "No finding at all (allow)"
        - "warn instead of redact"
        - "warn instead of block"
        - "redact instead of block"
        - "Other (describe below)"
    validations:
      required: true

  - type: textarea
    id: repro-shape
    attributes:
      label: Safe reproduction shape
      description: >-
        Describe the input's structural shape using an independently authored
        synthetic value with the same grammar, prefix, and length as the real
        one — never the real value. Paste the local reproduction template's
        JSON output here if you ran it (see the reporting guide).
      render: text
    validations:
      required: true

  - type: checkboxes
    id: safety-ack
    attributes:
      label: Safety acknowledgement
      options:
        - label: >-
            I have not included any live, revoked-but-real, or real-derived
            credential anywhere in this report or its attachments.
          required: true
        - label: >-
            Any log, screenshot, prompt export, or tool payload I attached has
            been manually reviewed and sanitized by me.
          required: false
