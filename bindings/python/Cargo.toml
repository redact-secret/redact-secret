[package]
name = "redact-secret-python"
description = "PyO3 extension module exposing the redact-secret core to CPython."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "redact_secret_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enabled by maturin (see pyproject.toml). Off by default so `cargo test` can
# link the crate as a normal library on every host.
extension-module = ["pyo3/extension-module"]

[dependencies]
redact-secret.workspace = true
pyo3 = { workspace = true, features = ["abi3-py310"] }

[dev-dependencies]
# Test-only: lets the unit tests read
# `conformance/fixtures/action-policy-v1.json` directly instead of copying its
# values into Rust (`decision-govern-cross-language-conformance`).
serde_json = "1"

[lints]
workspace = true
