[package]
name = "redact-secret-wasm"
description = "wasm-bindgen WebAssembly build exposing the redact-secret core to browsers."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The one profile-selection feature (`decision-define-detector-profile-and-pack-contract`).
# Default on: the default build is the `full` artifact, unchanged. Building
# with `--no-default-features` links only the `common` registry constructor,
# so no `provider` detector code is reachable from the artifact. This crate is
# a leaf nothing depends on, so feature unification cannot reach it from
# outside; forgetting `--no-default-features` yields `full` (more detection,
# never less), which the artifact's `profile()` export makes detectable.
[features]
default = ["full"]
full = []

[dependencies]
redact-secret.workspace = true
wasm-bindgen.workspace = true
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Test-only: lets the unit tests below read
# `conformance/fixtures/unicode-conversion-corpus.json` directly instead of
# copying fixture values into Rust, which
# decision-govern-cross-language-conformance rejects.
serde_json = "1"

[lints]
workspace = true
